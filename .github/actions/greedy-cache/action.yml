name: "Greedy Cache"
description: "Start Attic watch-store daemon for concurrent binary cache push as derivations build. The pooled Nix cache read edge is ON by default and fails closed (TIN-4299 ruling 4, via nix-setup): a missing ATTIC_TOKEN degrades to a loud warning (instead of the generic \"not configured\") over the anonymous read-only substituter, and an unreachable or untrusted substituter hard-fails; the watch-store push daemon still requires a valid token either way. `attic-public-read: false` is an explicit opt-out for lanes that never touch Nix (pre-TIN-4299 behavior, byte-identical)."

inputs:
  attic-server:
    description: "Attic server URL (auto-detected on self-hosted)"
    default: ""
  attic-cache:
    description: "Attic cache name to push to"
    default: "main"
  attic-public-read:
    description: "Default \"true\" (TIN-4299 ruling 4; BREAKING, lands in the next MAJOR). Passed through to nix-setup, which configures the pooled Nix cache read edge and fails closed when it cannot be trusted or reached; see its attic-public-read description. Never enables the watch-store push daemon by itself — that stays gated on a successful token-authenticated `attic login` exactly as before. \"false\" is an explicit opt-out for lanes that never touch Nix (pre-TIN-4299 behavior, byte-identical)."
    default: "true"
  attic-public-key:
    description: "Attic cache trusted public key passed through to nix-setup for the default-on attic-public-read read-only substituter. Empty by default; see nix-setup's attic-public-key precedence (a non-default server with no key fails closed)."
    default: ""
  watch-jobs:
    description: "Number of parallel upload jobs"
    default: "8"
  compression:
    description: "Compression algorithm (zstd, xz, none)"
    default: "zstd"
  shutdown-wait:
    description: "Seconds to wait for pending pushes on graceful stop"
    default: "15"

outputs:
  daemon-pid:
    description: "PID of the watch-store daemon"
    value: ${{ steps.start-daemon.outputs.pid }}
  cache-healthy:
    description: "Whether the Attic cache is authenticated and push-capable (requires a valid ATTIC_TOKEN and successful login)."
    value: ${{ steps.health-check.outputs.healthy }}

runs:
  using: "composite"
  steps:
    # Exact self-pin (RELEASING.md "Composite-action internal refs";
    # scripts/validate-ci-templates.py check_internal_refs). `uses:` resolves
    # nix-setup at ITS OWN ref: the floating `@v3` here passed the flipped
    # default to the v3-line opt-in nix-setup -- default-on but fail-OPEN
    # (TIN-4246 steamroll audit c2093793). v6.0.0 is the MAJOR the CHANGELOG
    # entry lands in; the release commit retargets this pin if it names another
    # version (RELEASING.md step 3).
    - uses: tinyland-inc/ci-templates/.github/actions/nix-setup@v6.0.0
      with:
        attic-server: ${{ inputs.attic-server }}
        attic-cache: ${{ inputs.attic-cache }}
        attic-public-read: ${{ inputs.attic-public-read }}
        attic-public-key: ${{ inputs.attic-public-key }}

    - name: Health check
      id: health-check
      shell: bash
      run: |
        if [ -z "${ATTIC_SERVER:-}" ] || [ -z "${ATTIC_TOKEN:-}" ]; then
          # attic-public-read (default "true", TIN-4299) only changes the
          # WARNING TEXT here, never the outcome: the watch-store push daemon
          # below stays gated on healthy=true either way, so it never starts
          # without a valid authenticated login regardless of this input.
          # ATTIC_PUBLIC_KEY is only ever non-empty when nix-setup's
          # attic-public-read block actually configured an anonymous
          # read-only substituter (never on the explicit opt-out path), so
          # the double guard keeps the opt-out message byte-identical to the
          # pre-TIN-4299 "Attic not configured" text.
          if [ "${{ inputs.attic-public-read }}" = "true" ] && [ -n "${ATTIC_PUBLIC_KEY:-}" ] && [ -z "${ATTIC_TOKEN:-}" ]; then
            echo "::warning::Attic token absent — anonymous public read only, pushes disabled"
          else
            echo "::warning::Attic not configured — greedy cache disabled"
          fi
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Install attic CLI if not available
        if ! command -v attic >/dev/null 2>&1; then
          nix profile install github:zhaofengli/attic/main#attic-client 2>/dev/null || true
        fi

        if attic login greedy-cache "$ATTIC_SERVER" "$ATTIC_TOKEN" 2>/dev/null; then
          echo "::notice::Attic cache healthy at $ATTIC_SERVER"
          echo "healthy=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Attic login failed — greedy cache disabled"
          echo "healthy=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure substituters
      if: steps.health-check.outputs.healthy == 'true'
      shell: bash
      run: |
        # Ordered 3-tier substituter hierarchy — authenticated path only
        # (this step requires healthy=true, i.e. a valid ATTIC_TOKEN and a
        # successful login above). The unauthenticated, tokenless read-only
        # case is nix-setup's job: its attic-public-read opt-in writes a
        # single-entry substituter (+ trusted key) directly to the same
        # nix.conf before this composite even reaches this step, and does so
        # ONLY when no token is in scope — so the two writers never fire for
        # the same server and never duplicate a substituter/key line.
        # 1. Project-specific cache (fastest, arch-specific binaries)
        # 2. Shared cache (architecture-independent sources, configs)
        # 3. cache.nixos.org (upstream fallback, always available)
        SUBS="${ATTIC_SERVER}/${{ inputs.attic-cache }}"
        if [ "${{ inputs.attic-cache }}" != "main" ]; then
          SUBS="${SUBS} ${ATTIC_SERVER}/main"
        fi
        SUBS="${SUBS} https://cache.nixos.org"

        mkdir -p ~/.config/nix
        cat >> ~/.config/nix/nix.conf << EOF
        extra-substituters = ${SUBS}
        extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
        EOF

    - name: Start watch-store daemon
      id: start-daemon
      if: steps.health-check.outputs.healthy == 'true'
      shell: bash
      run: |
        attic watch-store "${{ inputs.attic-cache }}" \
          --jobs "${{ inputs.watch-jobs }}" \
          --compression "${{ inputs.compression }}" \
          > /tmp/attic-watch.log 2>&1 &
        DAEMON_PID=$!
        echo "pid=${DAEMON_PID}" >> "$GITHUB_OUTPUT"
        echo "ATTIC_WATCH_PID=${DAEMON_PID}" >> "$GITHUB_ENV"
        echo "::notice::Attic watch-store daemon started (PID ${DAEMON_PID}, ${{ inputs.watch-jobs }} jobs)"
