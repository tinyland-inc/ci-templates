name: lane-dispatch
description: |
  Construct + emit the Blahaj `<spoke>-lane-env` `repository_dispatch`
  payload for provision. Payload shape conforms to
  schemas/blahaj-dispatch.schema.json.

  Reads lanes_json from a prior `lanes-load` invocation (NOT from a
  duplicated workflow YAML literal — MassageIthaca fix).

  Supports `dry_run` for local testability without a Blahaj round-trip.

  Contract: tinyland-inc/site.scaffold/docs/CI-SCHEMA.md §4 + §7.

inputs:
  pr_number:
    description: GitHub PR number.
    required: true
  commit_sha:
    description: Full 40-char commit SHA.
    required: true
  spoke:
    description: Spoke slug (matches lanes.json spoke.name).
    required: true
  domain:
    description: Spoke brand domain (matches lanes.json spoke.domain).
    required: true
  image_ref:
    description: Full GHCR image reference, e.g. ghcr.io/owner/spoke:pr-N-sha-XXXX.
    required: true
  lanes_json:
    description: Validated lanes array (from lanes-load output).
    required: true
  ttl_label_prefix:
    description: PR label prefix for per-PR TTL override (default `lane-ttl/`).
    required: false
    default: lane-ttl/
  pr_labels_json:
    description: JSON array of label names on the PR. Used to extract TTL override.
    required: false
    default: "[]"
  blahaj_repository:
    description: Compatibility receiver input. Only exact tinyland-inc/blahaj is accepted.
    required: false
    default: tinyland-inc/blahaj
  dispatch_token:
    description: GitHub token with repo:dispatch scope on exact tinyland-inc/blahaj. Required unless dry_run.
    required: false
    default: ""
  dry_run:
    description: If true, build + print payload, do not POST.
    required: false
    default: "false"

outputs:
  dispatch_id:
    description: Synthetic dispatch ID (spoke-prN-sha7-runID) for log correlation.
    value: ${{ steps.build.outputs.dispatch_id }}
  payload_path:
    description: Path to the saved payload JSON file.
    value: ${{ steps.build.outputs.payload_path }}
  ttl_hours:
    description: Effective top-level TTL (after applying label override).
    value: ${{ steps.build.outputs.ttl_hours }}

runs:
  using: composite
  steps:
    - name: Build payload
      id: build
      shell: bash
      run: |
        set -euo pipefail

        if ! [[ "${SPOKE}" =~ ^[a-z][a-z0-9-]+$ ]]; then
          echo "::error::spoke must be a lowercase slug" >&2
          exit 64
        fi
        if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::pr_number must be a positive integer" >&2
          exit 64
        fi
        if ! [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::commit_sha must be a full lowercase commit SHA" >&2
          exit 64
        fi
        jq -e 'type == "array" and all(.[]; type == "object")' \
          <<<"${LANES_JSON}" >/dev/null
        jq -e 'type == "array" and all(.[]; type == "string")' \
          <<<"${PR_LABELS_JSON}" >/dev/null

        # Parse PR labels for TTL override (lane-ttl/7d, lane-ttl/30d, lane-ttl/keep)
        ttl_override=""
        prefix="${TTL_LABEL_PREFIX}"
        while IFS= read -r label; do
          if [[ "${label}" == "${prefix}keep" ]]; then
            ttl_override=720
            break
          elif [[ "${label}" == "${prefix}"* ]]; then
            suffix="${label#"${prefix}"}"
            if [[ "${suffix}" =~ ^([0-9]+)d$ ]]; then
              ttl_override=$(( BASH_REMATCH[1] * 24 ))
              break
            fi
          fi
        done < <(jq -r '.[]?' <<<"${PR_LABELS_JSON}")

        # Aggregate lanes with effective TTL
        payload_lanes=$(jq -c \
          --arg pr "${PR_NUMBER}" \
          --arg domain "${DOMAIN}" \
          --arg ttl_override "${ttl_override:-0}" \
          --arg default_ttl "72" \
          '[.[] | {
             name: .name,
             fqdn: (.domain // ("pr-" + $pr + "-" + .name + "." + $domain)),
             theme: .theme,
             snapshot_source: .snapshot_source,
             tofu_state_suffix: (.tofu_state_suffix // .name),
             e2e: (.e2e // false),
             ttl_hours: (
               (($ttl_override | tonumber) as $o |
                if $o > 0 then ($o | if . > 720 then 720 else . end)
                else (.ttl_hours // ($default_ttl | tonumber))
                end)
             )
           } + (if .extra then {extra: .extra} else {} end)]' <<<"${LANES_JSON}")

        top_ttl=$(jq '[.[].ttl_hours] | max' <<<"${payload_lanes}")

        payload=$(jq -nc \
          --arg event_type "${SPOKE}-lane-env" \
          --arg spoke "${SPOKE}" \
          --arg domain "${DOMAIN}" \
          --argjson pr "${PR_NUMBER}" \
          --arg commit_sha "${COMMIT_SHA}" \
          --arg image_ref "${IMAGE_REF}" \
          --argjson ttl "$top_ttl" \
          --argjson lanes "$payload_lanes" \
          '{
            event_type: $event_type,
            client_payload: {
              schema_version: 1,
              operation: "provision",
              spoke: $spoke,
              domain: $domain,
              pr_number: $pr,
              source_ref: ("refs/pull/" + ($pr | tostring) + "/head"),
              commit_sha: $commit_sha,
              image_ref: $image_ref,
              ttl_hours: $ttl,
              tofu_state_prefix: ($spoke + "/" + ($pr | tostring)),
              lanes: $lanes
            }
          }')

        dispatch_id="${SPOKE}-pr${PR_NUMBER}-${COMMIT_SHA:0:7}-${GITHUB_RUN_ID}"
        payload_path="${RUNNER_TEMP}/blahaj-dispatch-${dispatch_id}.json"
        echo "$payload" | jq . > "$payload_path"

        {
          echo "dispatch_id=$dispatch_id"
          echo "payload_path=$payload_path"
          echo "ttl_hours=$top_ttl"
        } >> "$GITHUB_OUTPUT"

        echo "::group::Blahaj dispatch payload ($dispatch_id)"
        cat "$payload_path"
        echo "::endgroup::"
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        COMMIT_SHA: ${{ inputs.commit_sha }}
        SPOKE: ${{ inputs.spoke }}
        DOMAIN: ${{ inputs.domain }}
        IMAGE_REF: ${{ inputs.image_ref }}
        LANES_JSON: ${{ inputs.lanes_json }}
        TTL_LABEL_PREFIX: ${{ inputs.ttl_label_prefix }}
        PR_LABELS_JSON: ${{ inputs.pr_labels_json }}

    - name: Validate against schema
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, sys
        from jsonschema import Draft202012Validator
        schema_path = os.path.join(
            os.environ["ACTION_PATH"], "../../../schemas/blahaj-dispatch.schema.json"
        )
        with open(schema_path, encoding="utf-8") as stream:
            schema = json.load(stream)
        with open(os.environ["PAYLOAD_PATH"], encoding="utf-8") as stream:
            payload = json.load(stream)
        errs = sorted(
            Draft202012Validator(schema).iter_errors(payload),
            key=lambda e: list(e.absolute_path),
        )
        if errs:
            for e in errs:
                p = "/" + "/".join(str(x) for x in e.absolute_path)
                print(f"::error::payload at {p}: {e.message}", file=sys.stderr)
            sys.exit(1)
        PY
      env:
        ACTION_PATH: ${{ github.action_path }}
        PAYLOAD_PATH: ${{ steps.build.outputs.payload_path }}

    - name: Dispatch
      if: inputs.dry_run != 'true'
      shell: bash
      run: |
        set -euo pipefail
        bash "${DISPATCH_HELPER}" "${BLAHAJ_REPOSITORY}" "${PAYLOAD_PATH}"
        echo "::notice::dispatched ${DISPATCH_ID} → ${BLAHAJ_REPOSITORY}"
      env:
        DISPATCH_HELPER: ${{ github.action_path }}/../../../scripts/blahaj-repository-dispatch.sh
        GH_TOKEN: ${{ inputs.dispatch_token }}
        BLAHAJ_REPOSITORY: ${{ inputs.blahaj_repository }}
        PAYLOAD_PATH: ${{ steps.build.outputs.payload_path }}
        DISPATCH_ID: ${{ steps.build.outputs.dispatch_id }}

    - name: Dry-run notice
      if: inputs.dry_run == 'true'
      shell: bash
      run: |
        echo "::notice::dry_run=true — payload built and validated, NOT dispatched"
