name: lane-reap
description: |
  Construct + emit the Blahaj `<spoke>-lane-env` `repository_dispatch`
  payload for destroy. Payload shape conforms to
  schemas/blahaj-dispatch.schema.json (`operation: destroy`).

  Idempotent. Blahaj treats "env does not exist" as success.

  Contract: tinyland-inc/site.scaffold/docs/CI-SCHEMA.md §4 + §7.

inputs:
  pr_number:
    description: GitHub PR number.
    required: true
  spoke:
    description: Spoke slug.
    required: true
  domain:
    description: Spoke brand domain.
    required: false
    default: ""
  commit_sha:
    description: PR head commit SHA at close time.
    required: true
  lanes_json:
    description: Lanes array from lanes-load (defaults to all lanes for reap).
    required: true
  blahaj_repository:
    description: Compatibility receiver input. Only exact tinyland-inc/blahaj is accepted.
    required: false
    default: tinyland-inc/blahaj
  dispatch_token:
    description: GitHub token with repo:dispatch scope on exact tinyland-inc/blahaj.
    required: false
    default: ""
  dry_run:
    description: If true, build + print payload, do not POST.
    required: false
    default: "false"

outputs:
  dispatch_id:
    description: Synthetic dispatch ID.
    value: ${{ steps.build.outputs.dispatch_id }}
  payload_path:
    description: Path to the saved payload JSON file.
    value: ${{ steps.build.outputs.payload_path }}

runs:
  using: composite
  steps:
    - name: Build destroy payload
      id: build
      shell: bash
      run: |
        set -euo pipefail
        if ! [[ "${SPOKE}" =~ ^[a-z][a-z0-9-]+$ ]]; then
          echo "::error::spoke must be a lowercase slug" >&2
          exit 64
        fi
        if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::pr_number must be a positive integer" >&2
          exit 64
        fi
        if ! [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::commit_sha must be a full lowercase commit SHA" >&2
          exit 64
        fi
        jq -e 'type == "array" and all(.[]; type == "object")' \
          <<<"${LANES_JSON}" >/dev/null

        payload_lanes=$(jq -c \
          --arg pr "${PR_NUMBER}" \
          --arg domain "${DOMAIN}" \
          '[.[] | { name: .name, fqdn: (.domain // ("pr-" + $pr + "-" + .name + "." + $domain)) }]' \
          <<<"${LANES_JSON}")

        payload=$(jq -nc \
          --arg event_type "${SPOKE}-lane-env" \
          --arg spoke "${SPOKE}" \
          --arg domain "${DOMAIN}" \
          --argjson pr "${PR_NUMBER}" \
          --arg commit_sha "${COMMIT_SHA}" \
          --argjson lanes "$payload_lanes" \
          '{
            event_type: $event_type,
            client_payload: ({
              schema_version: 1,
              operation: "destroy",
              spoke: $spoke,
              pr_number: $pr,
              source_ref: ("refs/pull/" + ($pr | tostring) + "/head"),
              commit_sha: $commit_sha,
              image_ref: "expired-destroy",
              ttl_hours: 1,
              tofu_state_prefix: ($spoke + "/" + ($pr | tostring)),
              lanes: $lanes
            } + (if $domain != "" then {domain: $domain} else {} end))
          }')

        dispatch_id="${SPOKE}-pr${PR_NUMBER}-reap-${GITHUB_RUN_ID}"
        payload_path="${RUNNER_TEMP}/blahaj-reap-${dispatch_id}.json"
        echo "$payload" | jq . > "$payload_path"

        {
          echo "dispatch_id=$dispatch_id"
          echo "payload_path=$payload_path"
        } >> "$GITHUB_OUTPUT"

        echo "::group::Blahaj reap payload ($dispatch_id)"
        cat "$payload_path"
        echo "::endgroup::"
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        SPOKE: ${{ inputs.spoke }}
        DOMAIN: ${{ inputs.domain }}
        COMMIT_SHA: ${{ inputs.commit_sha }}
        LANES_JSON: ${{ inputs.lanes_json }}

    - name: Validate against schema
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, sys
        from jsonschema import Draft202012Validator
        schema_path = os.path.join(
            os.environ["ACTION_PATH"], "../../../schemas/blahaj-dispatch.schema.json"
        )
        with open(schema_path, encoding="utf-8") as stream:
            schema = json.load(stream)
        with open(os.environ["PAYLOAD_PATH"], encoding="utf-8") as stream:
            payload = json.load(stream)
        errs = sorted(
            Draft202012Validator(schema).iter_errors(payload),
            key=lambda e: list(e.absolute_path),
        )
        if errs:
            for e in errs:
                p = "/" + "/".join(str(x) for x in e.absolute_path)
                print(f"::error::payload at {p}: {e.message}", file=sys.stderr)
            sys.exit(1)
        PY
      env:
        ACTION_PATH: ${{ github.action_path }}
        PAYLOAD_PATH: ${{ steps.build.outputs.payload_path }}

    - name: Dispatch
      if: inputs.dry_run != 'true'
      shell: bash
      run: |
        set -euo pipefail
        bash "${DISPATCH_HELPER}" "${BLAHAJ_REPOSITORY}" "${PAYLOAD_PATH}" best-effort
      env:
        DISPATCH_HELPER: ${{ github.action_path }}/../../../scripts/blahaj-repository-dispatch.sh
        GH_TOKEN: ${{ inputs.dispatch_token }}
        BLAHAJ_REPOSITORY: ${{ inputs.blahaj_repository }}
        PAYLOAD_PATH: ${{ steps.build.outputs.payload_path }}

    - name: Dry-run notice
      if: inputs.dry_run == 'true'
      shell: bash
      run: |
        echo "::notice::dry_run=true — reap payload built and validated, NOT dispatched"
