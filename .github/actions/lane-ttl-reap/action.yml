name: lane-ttl-reap
description: |
  Construct + emit the Blahaj `<spoke>-lane-ttl-reap`
  `repository_dispatch` payload for scheduled expired-lane cleanup.
  Blahaj owns listing and idempotent destruction.

inputs:
  spoke:
    description: Spoke slug.
    required: true
  domain:
    description: Spoke brand domain.
    required: true
  dry_run:
    description: Ask Blahaj to report expired lanes without deleting them.
    required: false
    default: "false"
  blahaj_repository:
    description: Compatibility receiver input. Only exact tinyland-inc/blahaj is accepted.
    required: false
    default: tinyland-inc/blahaj
  dispatch_token:
    description: GitHub token with repo:dispatch scope on exact tinyland-inc/blahaj. Required unless local dry_run_only is true.
    required: false
    default: ""
  dry_run_only:
    description: Build + validate the payload but do not POST.
    required: false
    default: "false"

outputs:
  payload_path:
    description: Saved payload path.
    value: ${{ steps.build.outputs.payload_path }}
  dispatch_id:
    description: Synthetic dispatch ID.
    value: ${{ steps.build.outputs.dispatch_id }}

runs:
  using: composite
  steps:
    - name: Build TTL reap payload
      id: build
      shell: bash
      run: |
        set -euo pipefail
        if ! [[ "${SPOKE}" =~ ^[a-z][a-z0-9-]+$ ]]; then
          echo "::error::spoke must be a lowercase slug" >&2
          exit 64
        fi
        requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        case "${DRY_RUN}" in
          true|false) ;;
          *)
            echo "::error::dry_run must be true or false"
            exit 64
            ;;
        esac

        payload="$(jq -nc \
          --arg event_type "${SPOKE}-lane-ttl-reap" \
          --arg spoke "${SPOKE}" \
          --arg domain "${DOMAIN}" \
          --arg requested_at "${requested_at}" \
          --argjson dry_run "${DRY_RUN}" \
          '{
            event_type: $event_type,
            client_payload: {
              schema_version: 1,
              operation: "reap-expired",
              spoke: $spoke,
              domain: $domain,
              requested_at: $requested_at,
              dry_run: $dry_run
            }
          }')"

        dispatch_id="${SPOKE}-ttl-reap-${GITHUB_RUN_ID}"
        payload_path="${RUNNER_TEMP}/lane-ttl-reap-${dispatch_id}.json"
        echo "${payload}" | jq . > "${payload_path}"
        {
          echo "dispatch_id=${dispatch_id}"
          echo "payload_path=${payload_path}"
        } >> "${GITHUB_OUTPUT}"
        cat "${payload_path}"
      env:
        SPOKE: ${{ inputs.spoke }}
        DOMAIN: ${{ inputs.domain }}
        DRY_RUN: ${{ inputs.dry_run }}

    - name: Validate against schema
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, re, sys
        try:
            from jsonschema import Draft202012Validator
        except ImportError:
            Draft202012Validator = None
        schema_path = os.path.join(
            os.environ["ACTION_PATH"],
            "../../../schemas/lane-ttl-reap-dispatch.schema.json",
        )
        with open(schema_path, encoding="utf-8") as stream:
            schema = json.load(stream)
        with open(os.environ["PAYLOAD_PATH"], encoding="utf-8") as stream:
            payload = json.load(stream)
        if Draft202012Validator is None:
            cp = payload.get("client_payload", {})
            ok = (
                re.match(r"^[a-z][a-z0-9-]+-lane-ttl-reap$", payload.get("event_type", "")) and
                cp.get("schema_version") == 1 and
                cp.get("operation") == "reap-expired" and
                isinstance(cp.get("dry_run"), bool)
            )
            if not ok:
                print("::error::payload failed minimal lane-ttl-reap validation", file=sys.stderr)
                sys.exit(1)
            print("::warning::jsonschema unavailable; used minimal lane-ttl-reap validation")
        else:
            errs = sorted(Draft202012Validator(schema).iter_errors(payload), key=lambda e: list(e.absolute_path))
            if errs:
                for e in errs:
                    p = "/" + "/".join(str(x) for x in e.absolute_path)
                    print(f"::error::payload at {p}: {e.message}", file=sys.stderr)
                sys.exit(1)
        PY
      env:
        ACTION_PATH: ${{ github.action_path }}
        PAYLOAD_PATH: ${{ steps.build.outputs.payload_path }}

    - name: Dispatch
      if: inputs.dry_run_only != 'true'
      shell: bash
      run: |
        set -euo pipefail
        bash "${DISPATCH_HELPER}" "${BLAHAJ_REPOSITORY}" "${PAYLOAD_PATH}"
      env:
        DISPATCH_HELPER: ${{ github.action_path }}/../../../scripts/blahaj-repository-dispatch.sh
        GH_TOKEN: ${{ inputs.dispatch_token }}
        BLAHAJ_REPOSITORY: ${{ inputs.blahaj_repository }}
        PAYLOAD_PATH: ${{ steps.build.outputs.payload_path }}
