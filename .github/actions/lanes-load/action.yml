name: lanes-load
description: |
  Validate and load the fixed .github/lanes.json v4 Bazel action plan.
  Attachment authority lives only in tinyland.repo.json. This action exposes
  the complete finite plan; it has no filter or partial-execution path.

outputs:
  actions_path:
    description: Absolute path to a read-only validated action-map snapshot under RUNNER_TEMP.
    value: ${{ steps.load.outputs.actions_path }}
  schema_version:
    description: Validated action-plan schema version.
    value: ${{ steps.load.outputs.schema_version }}

runs:
  using: composite
  steps:
    - name: Validate executable action plan
      id: load
      shell: bash
      run: |
        set -euo pipefail
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        plan=.github/lanes.json
        schema="${{ github.action_path }}/../../../schemas/lanes.schema.json"

        [[ -f "$plan" ]] || { echo "::error file=$plan::v4 action plan is missing"; exit 1; }
        [[ -f "$schema" ]] || { echo "::error::ci-templates action-plan schema is missing at $schema"; exit 1; }
        [[ -n "${RUNNER_TEMP:-}" && -d "$RUNNER_TEMP" ]] || { echo "::error::RUNNER_TEMP is unavailable"; exit 1; }
        for tool in python3 jq mktemp chmod; do
          command -v "$tool" >/dev/null || { echo "::error::required preinstalled tool is absent: $tool"; exit 5; }
        done
        if ! python3 -c 'import jsonschema' >/dev/null 2>&1; then
          echo "::error::python3 cannot import jsonschema; v4 refuses a weaker validator and has no installer or devshell fallback"
          exit 5
        fi

        actions_path="$(mktemp "$RUNNER_TEMP/tinyland-v4-actions.XXXXXX.json")"
        schema_version="$(python3 - "$schema" "$plan" "$actions_path" <<'PY'
        import json
        import sys
        from pathlib import Path
        from jsonschema import Draft202012Validator

        schema_path, plan_path, actions_path = map(Path, sys.argv[1:])

        class DuplicateNameError(ValueError):
            pass

        def reject_duplicate_names(pairs):
            value = {}
            for name, member in pairs:
                if name in value:
                    raise DuplicateNameError(f"duplicate JSON object name {name!r}")
                value[name] = member
            return value

        def load_json(path):
            try:
                return json.loads(
                    path.read_text(encoding="utf-8"),
                    object_pairs_hook=reject_duplicate_names,
                )
            except (json.JSONDecodeError, DuplicateNameError) as error:
                print(f"::error file={path}::{error}", file=sys.stderr)
                raise SystemExit(1) from error

        schema = load_json(schema_path)
        plan = load_json(plan_path)
        Draft202012Validator.check_schema(schema)
        errors = sorted(
            Draft202012Validator(schema).iter_errors(plan),
            key=lambda error: list(error.absolute_path),
        )
        for error in errors:
            path = "/" + "/".join(str(part) for part in error.absolute_path)
            print(f"::error file={plan_path}::at {path}: {error.message}", file=sys.stderr)
        if errors:
            raise SystemExit(1)

        actions_path.write_text(
            json.dumps(plan["actions"], ensure_ascii=False, separators=(",", ":")) + "\n",
            encoding="utf-8",
        )
        print(plan["schema_version"])
        PY
        )"
        [[ "$schema_version" == 2 ]] || { echo "::error::validated action-plan schema version is not 2"; exit 1; }

        chmod 0444 "$actions_path"
        {
          echo "actions_path=$actions_path"
          echo "schema_version=$schema_version"
        } >>"$GITHUB_OUTPUT"
        echo "::notice::loaded $(jq 'length' "$actions_path") executable v4 action(s); names are unique JSON object keys"
