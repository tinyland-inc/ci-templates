name: repo-manifest-validate
description: |
  Validate tinyland.repo.json against the Tinyland repo manifest schema and,
  optionally, require one or more taxonomy roles.

inputs:
  path:
    description: Path to tinyland.repo.json relative to the consumer repo checkout.
    required: false
    default: tinyland.repo.json
  required_roles:
    description: |
      Optional list of accepted taxonomy.primary_role values, as either a
      comma-separated string or a JSON array. Both forms normalize identically
      (TIN-3815): surrounding brackets, quotes, and whitespace are stripped
      before the comma split, so `["static-spoke","app-stateful-spoke"]` and
      `static-spoke, app-stateful-spoke` are the same list.
      Example: static-spoke,static-spoke-scaffold
    required: false
    default: ""

outputs:
  primary_role:
    description: taxonomy.primary_role from the manifest.
    value: ${{ steps.read.outputs.primary_role }}
  repo_name:
    description: repo.name from the manifest.
    value: ${{ steps.read.outputs.repo_name }}

runs:
  using: composite
  steps:
    - name: Validate repo manifest schema
      shell: bash
      run: |
        set -euo pipefail
        action_dir="${{ github.action_path }}"
        schemas_dir="$action_dir/../../../schemas"
        validator="$action_dir/../../../scripts/manifest-schema-validate.py"
        manifest="${{ inputs.path }}"
        if [[ ! -d "$schemas_dir" ]]; then
          echo "::error::ci-templates schema directory missing at $schemas_dir"
          exit 1
        fi
        if [[ ! -f "$validator" ]]; then
          echo "::error::ci-templates manifest validator missing at $validator"
          exit 1
        fi
        if [[ ! -f "$manifest" ]]; then
          echo "::error::repo manifest not found at $manifest"
          exit 1
        fi

        # ONE ENGINE, OR NO VERDICT (TIN-4132/TIN-4192, superseding the
        # TIN-2109 fallback posture). This step used to accept a bundled
        # stdlib JSON-Schema-SUBSET validator whenever `jsonschema` was not
        # importable. That subset never evaluated `not`, `contains`, or
        # `anyOf` — the keywords in which BOTH manifest schemas express every
        # prohibition — so on exactly the runners it existed for it reported
        # "valid" for manifests carrying prohibited keys. A gate that reads as
        # coverage while enforcing nothing is worse than an absent one.
        #
        # Its reason for existing is also dead: the cold-`nix develop`
        # store-lock failure belonged to the shared-store host-runner
        # generation, and current ARC pods mount per-pod ephemeral nix stores
        # (GF substrate confirmation, 2026-08-27).
        #
        # Supplying the dependency is the CALLING WORKFLOW's job. No
        # ci-templates composite does it: nix-setup detects Attic and Bazel
        # cache endpoints, setup-nix installs Nix and its daemon, and neither
        # installs a python package. A runner without it gets a visible red
        # naming the dependency — never a silently weaker verdict.
        #
        # RELEASE GATE, not a merge gate: cutting a v2/v3 release carrying this
        # refusal turns the manifest gate red for spoke-ci consumers on the
        # self-hosted nix pool, where the deleted fallback is load-bearing
        # TODAY (site.scaffold run 33204538631, 2026-08-28: "host python lacks
        # jsonschema; using bundled stdlib validator", after setup-nix had
        # already run). spoke-ci.yml calls repo-manifest-validate@v3 — a
        # FLOATING inner ref — so even a consumer pinned to the immutable
        # spoke-ci.yml@v3.1.0 picks this up the moment @v3 moves, with nothing
        # on their side changing. Provision the pool, or the calling job,
        # before tagging.
        #
        # This step deliberately does NOT shell out to `nix develop` itself.
        # The TIN-2109 ruling that this action must not depend on it still
        # stands and is asserted by `just cache-backed-optin-contract-check`;
        # providing the interpreter is the calling workflow's job, and doing it
        # here would make the gate's own bootstrap a second failure surface.
        # The remedy named here must be one that WORKS. An earlier draft told
        # the operator to "run the nix-setup composite in this job", which
        # cannot help: nix-setup detects Attic and Bazel cache endpoints, and
        # setup-nix installs Nix and its daemon. Neither installs a python
        # package, so that sentence sent a blocked caller to a composite with
        # nothing to give them. A refusal with an inert remedy is a hard stop
        # with no exit.
        if ! python3 -c 'import jsonschema' >/dev/null 2>&1; then
          echo "::error::python3 cannot import 'jsonschema', so this gate has no validator. It REFUSES to substitute a weaker one (TIN-4132). Remedy: make the python3 this job runs one that CAN import it — add a step BEFORE this one that puts it on PATH (\`nix profile install nixpkgs#python3Packages.jsonschema\`), or run the calling job inside a devshell that carries it. The ci-templates nix-setup and setup-nix composites do NOT provide it: nix-setup configures Attic/Bazel cache endpoints, setup-nix installs Nix itself, and neither installs a python package."
          exit 5
        fi

        # Route by the manifest's own schema_version rather than hardcoding the
        # v1 schema. This step used to pass schemas/tinyland-repo-manifest.schema.json
        # unconditionally, so a consumer that had migrated to schema_version 2 —
        # a published, supported version — failed the gate with a wall of
        # `Additional properties are not allowed` and `at /schema_version: 1 was
        # expected`, blaming the manifest for a branch the action did not have.
        #
        # --schemas-dir hands the whole vendored schema directory to the
        # validator, which owns the version -> filename mapping (SCHEMA_BY_VERSION).
        # Keeping the mapping in ONE place is the point: a second copy here in
        # shell is how it would drift. The mapping is total — an absent,
        # mistyped, or unpublished schema_version exits 3 naming the value it
        # saw, and is never quietly routed to v1.
        # Exit-code vocabulary, shared with the validator and asserted by
        # scripts/manifest-schema-validate-selftest.sh:
        #   0 valid  1 invalid  2 usage/IO  3 unpublished version
        #   4 routed schema absent  5 no JSON Schema engine
        #
        # 2 and 5 used to be ONE code, and this case statement is where that
        # cost something. The `2)` arm below was written for the refusal, so it
        # announced "this is a RUNNER problem, not a manifest problem" — and
        # then inherited every usage/IO error too. A consumer whose
        # tinyland.repo.json had a stray comma was told their runner image was
        # broken while the validator's own honest `::error::cannot read
        # manifest: Expecting value: line 1 column 32` scrolled past above it.
        # Worse than the wrong words: it is the same "two copies of one fact
        # drift apart" failure this change exists to close, reproduced one
        # directory away from the file it was closing it in.
        set +e
        python3 "$validator" --schemas-dir "$schemas_dir" "$manifest"
        rc=$?
        set -e
        case "$rc" in
          0) ;;
          5)
            echo "::error::the manifest gate could not run: no JSON Schema engine was available (see the error above). This is a RUNNER problem, not a manifest problem — nothing validated $manifest."
            exit 5
            ;;
          2)
            echo "::error file=$manifest::the manifest gate could not run: a usage or IO error (see the error above) — most often $manifest is unreadable or is not valid JSON. Nothing validated it. This is NOT a runner problem: the engine was already proven importable by the check above."
            exit 1
            ;;
          3)
            echo "::error file=$manifest::repo manifest declares a schema_version this ci-templates release publishes no schema for (see the error above). Supported versions ship under schemas/ — if this is a real new revision, vendor its schema and extend SCHEMA_BY_VERSION in scripts/manifest-schema-validate.py."
            exit 1
            ;;
          4)
            echo "::error file=$manifest::the schema this manifest routes to is missing from the ci-templates checkout, so NOTHING validated it. This is a broken release, not a manifest problem."
            exit 1
            ;;
          *) exit "$rc" ;;
        esac

    - name: Read manifest role
      id: read
      shell: bash
      run: |
        set -euo pipefail
        manifest="${{ inputs.path }}"
        primary_role=$(jq -r '.taxonomy.primary_role' "$manifest")
        repo_name=$(jq -r '.repo.name' "$manifest")
        required="${{ inputs.required_roles }}"

        # TIN-3815: accept a JSON array as readily as a comma-separated string.
        # Stripping [ ] " ' and whitespace turns `["a","b"]` into `a,b`, so the
        # existing comma split handles both spellings with no second code path.
        required="${required//[][\"\' $'\t'$'\n']/}"

        if [[ -n "$required" ]]; then
          found=false
          IFS=',' read -ra roles <<< "$required"
          for role in "${roles[@]}"; do
            [[ -z "$role" ]] && continue
            if [[ "$primary_role" == "$role" ]]; then
              found=true
              break
            fi
          done
          if [[ "$found" != "true" ]]; then
            echo "::error file=$manifest::taxonomy.primary_role=$primary_role is not one of: $required"
            # Name the remedy: the census is caller-configurable since TIN-3815,
            # so a legitimately-ratified role is one workflow input away rather
            # than a template edit. Silence here is what made the census look
            # like a hard wall.
            echo "::error::If $primary_role is correct for this repo, widen the census from the caller: pass allowed_repo_roles: $required,$primary_role to spoke-ci.yml (comma-separated or JSON array). See ci-templates README."
            exit 1
          fi
        fi

        {
          echo "primary_role=$primary_role"
          echo "repo_name=$repo_name"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::repo manifest valid (repo=$repo_name, primary_role=$primary_role)"
