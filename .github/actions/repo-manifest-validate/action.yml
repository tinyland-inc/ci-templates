name: repo-manifest-validate
description: |
  Validate tinyland.repo.json against the Tinyland repo manifest schema and,
  optionally, require one or more taxonomy roles.

inputs:
  path:
    description: Path to tinyland.repo.json relative to the consumer repo checkout.
    required: false
    default: tinyland.repo.json
  required_roles:
    description: |
      Optional list of accepted taxonomy.primary_role values, as either a
      comma-separated string or a JSON array. Both forms normalize identically
      (TIN-3815): surrounding brackets, quotes, and whitespace are stripped
      before the comma split, so `["static-spoke","app-stateful-spoke"]` and
      `static-spoke, app-stateful-spoke` are the same list.
      Example: static-spoke,static-spoke-scaffold
    required: false
    default: ""

outputs:
  primary_role:
    description: taxonomy.primary_role from the manifest.
    value: ${{ steps.read.outputs.primary_role }}
  repo_name:
    description: repo.name from the manifest.
    value: ${{ steps.read.outputs.repo_name }}

runs:
  using: composite
  steps:
    - name: Validate repo manifest schema
      shell: bash
      run: |
        set -euo pipefail
        action_dir="${{ github.action_path }}"
        schema_dir="$action_dir/../../../schemas"
        validator="$action_dir/../../../scripts/manifest-schema-validate.py"
        manifest="${{ inputs.path }}"

        if [[ ! -f "$manifest" ]]; then
          echo "::error::repo manifest not found at $manifest"
          exit 1
        fi

        # Dispatch on the manifest's OWN declared schema_version instead of
        # hardcoding v1.
        #
        # Hardcoding v1 was worse than having no gate: it looked like coverage.
        # A v2 manifest could not pass it -- MassageIthaca's real one fails with
        # 19 errors, starting `additional property 'runtime_network' is not
        # allowed` and `/schema_version: must equal const 1` -- so v2 adopters
        # forked around the action with hand-rolled jq checks and ended up with
        # LESS validation than before. Three repos are on v2 today
        # (MassageIthaca, bulkload, medical-massage-specialists-infra).
        #
        # Unknown versions fail closed. A manifest declaring schema_version 3
        # must not silently fall through to v2's rules.
        declared="$(python3 -c "
        import json, sys
        with open(sys.argv[1], encoding='utf-8') as handle:
            print(json.load(handle).get('schema_version', ''))
        " "$manifest" 2>/dev/null || true)"

        case "$declared" in
          1)  schema="$schema_dir/tinyland-repo-manifest.schema.json" ;;
          2)  schema="$schema_dir/tinyland-repo-manifest.v2.schema.json" ;;
          "") echo "::error file=$manifest::manifest declares no schema_version; expected 1 or 2"
              exit 1 ;;
          *)  echo "::error file=$manifest::unsupported schema_version '$declared'; this action validates 1 and 2. Vendor the new schema into ci-templates/schemas and extend this dispatch rather than widening an existing schema."
              exit 1 ;;
        esac
        echo "::notice::validating $manifest against schema_version $declared"

        if [[ ! -f "$schema" ]]; then
          echo "::error::ci-templates schema missing at $schema"
          exit 1
        fi
        if [[ ! -f "$validator" ]]; then
          echo "::error::ci-templates manifest validator missing at $validator"
          exit 1
        fi
        # Dependency-free, network-free validation (TIN-2109). The validator
        # prefers the authoritative `jsonschema` package when importable and
        # otherwise uses a stdlib JSON-Schema-subset fallback, so the gate works
        # on nix self-hosted cluster runners (where a cold `nix develop` can fail
        # on a nix-store lock) as well as on hosted runners. Fail-closed: a
        # non-zero exit (invalid manifest) fails the step.
        if ! python3 -c 'import jsonschema' >/dev/null 2>&1; then
          echo "::notice::host python lacks jsonschema; using bundled stdlib validator"
        fi
        python3 "$validator" "$schema" "$manifest"

    - name: Read manifest role
      id: read
      shell: bash
      run: |
        set -euo pipefail
        manifest="${{ inputs.path }}"
        primary_role=$(jq -r '.taxonomy.primary_role' "$manifest")
        repo_name=$(jq -r '.repo.name' "$manifest")
        required="${{ inputs.required_roles }}"

        # TIN-3815: accept a JSON array as readily as a comma-separated string.
        # Stripping [ ] " ' and whitespace turns `["a","b"]` into `a,b`, so the
        # existing comma split handles both spellings with no second code path.
        required="${required//[][\"\' $'\t'$'\n']/}"

        if [[ -n "$required" ]]; then
          found=false
          IFS=',' read -ra roles <<< "$required"
          for role in "${roles[@]}"; do
            [[ -z "$role" ]] && continue
            if [[ "$primary_role" == "$role" ]]; then
              found=true
              break
            fi
          done
          if [[ "$found" != "true" ]]; then
            echo "::error file=$manifest::taxonomy.primary_role=$primary_role is not one of: $required"
            # Name the remedy: the census is caller-configurable since TIN-3815,
            # so a legitimately-ratified role is one workflow input away rather
            # than a template edit. Silence here is what made the census look
            # like a hard wall.
            echo "::error::If $primary_role is correct for this repo, widen the census from the caller: pass allowed_repo_roles: $required,$primary_role to spoke-ci.yml (comma-separated or JSON array). See ci-templates README."
            exit 1
          fi
        fi

        {
          echo "primary_role=$primary_role"
          echo "repo_name=$repo_name"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::repo manifest valid (repo=$repo_name, primary_role=$primary_role)"
