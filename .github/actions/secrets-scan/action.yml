name: "Secrets Scan"
description: "Run TruffleHog and Gitleaks for verified secret detection. Surfaces a findings_count output and accepts extra_paths for per-spoke config layouts."

inputs:
  trufflehog-args:
    description: "Extra args for TruffleHog"
    default: "--only-verified"
  trufflehog-version:
    description: "TruffleHog version (pinned binary release; no Docker)"
    default: "3.95.3"
  trufflehog-sha256:
    description: "SHA-256 for the pinned Linux amd64 TruffleHog release archive"
    default: "5d836eae522540a32ca0f1a1e00efd4c3153a52462466a4b4008fac1e6c1a548"
  gitleaks-version:
    description: "Gitleaks version"
    default: "8.21.2"
  gitleaks-sha256:
    description: "SHA-256 for the pinned Linux x64 Gitleaks release archive"
    default: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
  gitleaks-config:
    description: "Path to .gitleaks.toml config (skipped if not found)"
    default: ".gitleaks.toml"
  extra_paths:
    description: |
      Extra paths to also scan for .gitleaks.toml, space-separated.
      Useful for spokes that keep their gitleaks config under tools/,
      config/, or similar. The first existing file wins.
    default: ""
  gitleaks-log-opts:
    description: |
      Passed through to `gitleaks detect --log-opts`, e.g. a PR's
      "<base-sha>..<head-sha>" diff range. Empty (default) scans full
      history, preserving prior behavior for existing consumers.
    default: ""
  redact:
    description: |
      Pass --redact to gitleaks so --verbose never prints a matched
      secret value, only the rule id. Defaults to "false" to preserve
      prior behavior for existing consumers (golden rule 2); callers
      that want redacted output set this to "true" explicitly (e.g.
      secrets-scan.yml / CT-03, TIN-3397).
    default: "false"

outputs:
  findings_count:
    description: "Number of gitleaks findings (0 if clean). Available for downstream surfacing into GITHUB_STEP_SUMMARY."
    value: ${{ steps.gitleaks.outputs.findings_count }}

runs:
  using: "composite"
  steps:
    # Docker-free: install checksum-pinned release archives and scan git history
    # directly. `--fail` exits non-zero only when results are found; with the
    # default `--only-verified` that means verified secrets.
    - name: Install TruffleHog
      shell: bash
      env:
        TRUFFLEHOG_VERSION: ${{ inputs.trufflehog-version }}
        TRUFFLEHOG_SHA256: ${{ inputs.trufflehog-sha256 }}
      run: |
        set -euo pipefail
        # /usr/local/bin is not writable on the nix self-hosted runners, so
        # install into a job-writable dir and export it onto PATH for the
        # subsequent scan steps via $GITHUB_PATH.
        BIN_DIR="${RUNNER_TEMP:-/tmp}/secrets-scan-bin"
        mkdir -p "$BIN_DIR"
        version="$TRUFFLEHOG_VERSION"
        expected_sha256="$TRUFFLEHOG_SHA256"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "::error::invalid TruffleHog version: $version"; exit 64;
        }
        [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]] || {
          echo "::error::invalid TruffleHog SHA-256"; exit 64;
        }
        archive="$BIN_DIR/trufflehog_${version}_linux_amd64.tar.gz"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          "https://github.com/trufflesecurity/trufflehog/releases/download/v${version}/trufflehog_${version}_linux_amd64.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --status
        tar --extract --gzip --file "$archive" --directory "$BIN_DIR" trufflehog
        chmod 0755 "$BIN_DIR/trufflehog"
        echo "$BIN_DIR" >> "$GITHUB_PATH"

    - name: TruffleHog scan
      shell: bash
      run: |
        trufflehog --no-update git "file://${GITHUB_WORKSPACE:-$PWD}" ${{ inputs.trufflehog-args }} --fail

    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        GITLEAKS_SHA256: ${{ inputs.gitleaks-sha256 }}
      run: |
        set -euo pipefail
        # Same job-writable bin dir as TruffleHog (/usr/local/bin is not
        # writable on the nix self-hosted runners).
        BIN_DIR="${RUNNER_TEMP:-/tmp}/secrets-scan-bin"
        mkdir -p "$BIN_DIR"
        version="$GITLEAKS_VERSION"
        expected_sha256="$GITLEAKS_SHA256"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "::error::invalid gitleaks version: $version"; exit 64;
        }
        [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]] || {
          echo "::error::invalid gitleaks SHA-256"; exit 64;
        }
        archive="$BIN_DIR/gitleaks_${version}_linux_x64.tar.gz"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --status
        tar --extract --gzip --file "$archive" --directory "$BIN_DIR" gitleaks
        chmod 0755 "$BIN_DIR/gitleaks"
        echo "$BIN_DIR" >> "$GITHUB_PATH"

    - name: Resolve gitleaks config
      id: cfg
      shell: bash
      run: |
        set -euo pipefail
        cfg=""
        # Honor explicit config first.
        if [ -f "${{ inputs.gitleaks-config }}" ]; then
          cfg="${{ inputs.gitleaks-config }}"
        else
          for p in ${{ inputs.extra_paths }}; do
            for candidate in "$p/.gitleaks.toml" "$p/gitleaks.toml"; do
              if [ -f "$candidate" ]; then cfg="$candidate"; break 2; fi
            done
          done
        fi
        echo "config=$cfg" >> "$GITHUB_OUTPUT"
        if [ -n "$cfg" ]; then
          echo "::notice::gitleaks using config $cfg"
        else
          echo "::notice::gitleaks running without explicit config"
        fi

    - name: Run gitleaks
      id: gitleaks
      shell: bash
      env:
        GITLEAKS_LOG_OPTS: ${{ inputs.gitleaks-log-opts }}
        GITLEAKS_REDACT: ${{ inputs.redact }}
      run: |
        set +e
        report="${RUNNER_TEMP:-/tmp}/gitleaks-report.json"
        ARGS=(detect --source . --verbose --report-format json --report-path "$report" --exit-code 1)
        # --redact is opt-in via the `redact` input (default "false",
        # preserving prior consumer behavior per golden rule 2): without
        # it, --verbose prints the raw matched secret to the job log.
        # Callers that need findings identifiable by rule id only, never
        # by value, set redact: "true" (CT-03/TIN-3397's secrets-scan.yml
        # does this explicitly).
        if [ "$GITLEAKS_REDACT" = "true" ]; then
          ARGS+=(--redact)
        fi
        if [ -n "${{ steps.cfg.outputs.config }}" ]; then
          ARGS+=(--config "${{ steps.cfg.outputs.config }}")
        fi
        if [ -n "$GITLEAKS_LOG_OPTS" ]; then
          ARGS+=(--log-opts "$GITLEAKS_LOG_OPTS")
        fi
        gitleaks "${ARGS[@]}"
        rc=$?
        set -e

        # Findings count from JSON report (empty file = no findings).
        if [ -s "$report" ]; then
          count=$(jq 'length' "$report" 2>/dev/null || echo 0)
        else
          count=0
        fi
        echo "findings_count=$count" >> "$GITHUB_OUTPUT"

        {
          echo "## Secrets scan"
          echo ""
          echo "- gitleaks findings: **$count**"
          if [ -n "${{ steps.cfg.outputs.config }}" ]; then
            echo "- config: \`${{ steps.cfg.outputs.config }}\`"
          fi
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

        exit $rc
