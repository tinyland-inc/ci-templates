name: v4-oci-bundle
description: |
  Build the fixed //:oci_publish_bundle target through the authenticated v4
  executor profile and package its validated OCI layout as one inert tar. This
  action has no package token, destination, tag, command, target, or fallback.

inputs:
  remote_upload:
    description: "false for same-repository pull requests; true only for main."
    required: true
  artifact_name:
    description: Run-derived inert archive filename.
    required: true
  source_sha:
    description: Exact admitted source commit bound to the inert image artifact.
    required: true

outputs:
  artifact_path:
    description: Exact inert OCI-layout tar path under RUNNER_TEMP.
    value: ${{ steps.bundle.outputs.artifact_path }}
  artifact_sha256:
    description: SHA-256 of the exact inert archive bytes.
    value: ${{ steps.bundle.outputs.artifact_sha256 }}
  image_digest:
    description: Descriptor-validated OCI image digest.
    value: ${{ steps.bundle.outputs.image_digest }}

runs:
  using: composite
  steps:
    - name: Build and validate canonical inert OCI layout
      id: bundle
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        REMOTE_UPLOAD: ${{ inputs.remote_upload }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_REF: ${{ github.ref }}
        PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -euo pipefail
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        refuse() { echo "::error::v4 OCI bundle refused: $*" >&2; exit 1; }

        read_root_receipt() {
          local receipt="$1"
          local label="$2"
          local receipt_stat receipt_newlines
          local -a receipt_lines=()

          [[ -f "$receipt" && ! -L "$receipt" ]] || refuse "$label receipt is absent or not a regular file: $receipt"
          receipt_stat="$(stat -c '%u:%g:%a' "$receipt")"
          [[ "$receipt_stat" == 0:0:444 ]] || refuse "$label receipt must be root:root mode 0444; got $receipt_stat"
          receipt_newlines="$(wc -l <"$receipt")"
          ((receipt_newlines == 1)) || refuse "$label receipt must contain one newline-terminated line"
          mapfile -t receipt_lines <"$receipt"
          ((${#receipt_lines[@]} == 1)) || refuse "$label receipt must contain exactly one line"
          printf '%s\n' "${receipt_lines[0]}"
        }

        custody_store_tool() {
          local command_name="$1"
          local receipt="/etc/tinyland/gf-client-${command_name}-store"
          local store_path expected_bin public_link gcroot store_mode

          store_path="$(read_root_receipt "$receipt" "$command_name store")"
          [[ "$store_path" =~ ^/nix/store/[0-9abcdfghijklmnpqrsvwxyz]{32}-[A-Za-z0-9][A-Za-z0-9._+~-]*$ ]] || refuse "$command_name receipt does not name one immutable Nix store output"
          [[ -d "$store_path" && ! -L "$store_path" ]] || refuse "$command_name receipt store is absent or not a directory"
          [[ "$(stat -c '%u:%g' "$store_path")" == 0:0 ]] || refuse "$command_name receipt store is not root:root-owned"
          store_mode="$(stat -c '%a' "$store_path")"
          (( (8#$store_mode & 8#022) == 0 )) || refuse "$command_name receipt store is group- or other-writable"
          expected_bin="$store_path/bin/$command_name"
          [[ -f "$expected_bin" && -x "$expected_bin" ]] || refuse "$command_name receipt does not contain its executable"
          [[ "$(readlink -f "$expected_bin")" == /nix/store/* ]] || refuse "$command_name executable resolves outside /nix/store"
          public_link="/usr/local/bin/$command_name"
          [[ -L "$public_link" ]] || refuse "$command_name public image path is not a symlink"
          [[ "$(stat -c '%u:%g' "$public_link")" == 0:0 ]] || refuse "$command_name public image symlink is not root:root-owned"
          [[ "$(readlink "$public_link")" == "$expected_bin" ]] || refuse "$command_name public image symlink disagrees with its receipt"
          gcroot="/nix/var/nix/gcroots/tinyland-gf-client-$command_name"
          [[ -L "$gcroot" && "$(readlink -f "$gcroot")" == "$store_path" ]] || refuse "$command_name GC root disagrees with its receipt"
          [[ "$(stat -c '%u:%g' "$gcroot")" == 0:0 ]] || refuse "$command_name GC root is not root:root-owned"
          printf '%s\n' "$expected_bin"
        }

        system_tool() {
          local path="$1" resolved mode
          [[ -e "$path" && -x "$path" && "$(stat -c '%u:%g' "$path")" == 0:0 ]] || refuse "trusted system tool is absent or not root-owned: $path"
          resolved="$(readlink -f "$path")"
          [[ -f "$resolved" && "$(stat -c '%u:%g' "$resolved")" == 0:0 ]] || refuse "trusted system tool target is not root-owned: $path"
          mode="$(stat -c '%a' "$resolved")"
          (( (8#$mode & 8#022) == 0 )) || refuse "trusted system tool target is writable outside root: $path"
        }

        cleanup() {
          local status=$?
          trap - EXIT
          rm -rf -- "${isolation_root:-}" "${token_dir:-}"
          exit "$status"
        }

        stage2_build() {
          isolation_root="${V4_ISOLATION_ROOT:?}"; exec_dir="$isolation_root/execution"
          REMOTE_UPLOAD="${V4_REMOTE_UPLOAD:?}"; ARTIFACT_NAME="${V4_ARTIFACT_NAME:?}"; RUNNER_TEMP="${V4_RUNNER_TEMP:?}"
          SOURCE_SHA="${V4_SOURCE_SHA:?}"; BUILD_DATE="${V4_BUILD_DATE:?}"; SOURCE_REPOSITORY="${V4_SOURCE_REPOSITORY:?}"
          GITHUB_OUTPUT="${V4_GITHUB_OUTPUT:?}"; GITHUB_STEP_SUMMARY="${V4_GITHUB_STEP_SUMMARY:?}"
          [[ -d "$isolation_root" && ! -L "$isolation_root" && "$(stat -c '%u:%g:%a' "$isolation_root")" == 0:0:700 ]] || refuse "stage-2 custody directory is invalid"
          [[ "$(id -u)" == 0 && "$(awk '$1 == "NoNewPrivs:" { print $2 }' /proc/self/status)" == 1 ]] || refuse "stage 2 requires root with no-new-privileges"
          case "$REMOTE_UPLOAD" in true|false) ;; *) refuse "stage-2 cache posture is malformed" ;; esac
          trap cleanup EXIT
          bwrap="$(custody_store_tool bwrap)"; [[ "$("$bwrap" --version)" == "bubblewrap 0.11.2" ]] || refuse "bubblewrap version disagrees with the image contract"
          launcher="$isolation_root/bazel"; [[ -f "$launcher" && ! -L "$launcher" && "$(stat -c '%u:%g:%a' "$launcher")" == 0:0:555 ]] || refuse "trusted Bazel launcher is invalid"
          source_status="$isolation_root/source-status"
          cat >"$source_status" <<EOF
        #!/bin/bash
        set -euo pipefail
        printf '%s\n' \
          'STABLE_BUILD_COMMIT_SHA ${SOURCE_SHA}' \
          'STABLE_BUILD_DATE ${BUILD_DATE}'
        EOF
          chown root:root "$source_status"; chmod 0555 "$source_status"
          sandbox_script="$isolation_root/sandbox"; cat >"$sandbox_script" <<'V4_OCI_SANDBOX'
        #!/bin/bash
        set -euo pipefail
        refuse() { echo "v4 OCI sandbox refused: $*" >&2; exit 1; }
        [[ "$(id -u):$(id -g):$(id -G)" == 65534:65534:65534 ]] || refuse "sandbox identity is not isolated"
        for environ in /proc/[0-9]*/environ; do
          [[ -r "$environ" ]] || continue
          while IFS= read -r -d '' entry; do case "${entry%%=*}" in ACTIONS_ID_TOKEN_REQUEST_URL|ACTIONS_ID_TOKEN_REQUEST_TOKEN|GITHUB_TOKEN|GH_TOKEN|GITHUB_ENV|GITHUB_OUTPUT|GITHUB_PATH|GITHUB_STEP_SUMMARY) refuse "private proc exposed ambient authority" ;; esac; done <"$environ"
        done
        [[ ! -e /home && ! -e /root && ! -e /run && ! -e /var/run ]] || refuse "ambient runner paths entered the sandbox"
        for name in ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN GITHUB_TOKEN GH_TOKEN GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY; do [[ ! -v $name ]] || refuse "ambient authority variable survived: $name"; done
        for path in /usr/.v4-write /nix/store/.v4-write /etc/.v4-write /trusted/.v4-write /workspace/.v4-write; do if (: >"$path") 2>/dev/null; then refuse "read-only mount accepted a write: $path"; fi; done
        : >/work/.v4-write && rm /work/.v4-write
        [[ -f /work/cell-token.jwt && ! -L /work/cell-token.jwt && "$(stat -c '%a' /work/cell-token.jwt)" == 600 ]] || refuse "scoped cell token is invalid"
        "$GF_VERIFY_BIN"
        "$GF_BAZEL_WRAPPER" build --symlink_prefix=/work/symlinks/bazel- //:oci_publish_bundle //:oci_publish_bundle.digest --remote_download_outputs=all --lockfile_mode=error \
          --stamp --workspace_status_command=/trusted/source-status
        V4_OCI_SANDBOX
          chown root:root "$sandbox_script"; chmod 0555 "$sandbox_script"
          bwrap_args=(
            --unshare-user --unshare-pid --unshare-ipc --unshare-uts --unshare-cgroup-try --die-with-parent --new-session --cap-drop ALL --clearenv
            --tmpfs / --dir /bin --ro-bind /bin /bin --dir /sbin --ro-bind /sbin /sbin --dir /lib --ro-bind /lib /lib --dir /lib64 --ro-bind /lib64 /lib64 --dir /usr --ro-bind /usr /usr
            --dir /nix --dir /nix/store --ro-bind /nix/store /nix/store --dir /etc --ro-bind /etc/passwd /etc/passwd --ro-bind /etc/group /etc/group --ro-bind /etc/resolv.conf /etc/resolv.conf --ro-bind /etc/hosts /etc/hosts --ro-bind /etc/nsswitch.conf /etc/nsswitch.conf --dir /etc/ssl --ro-bind /etc/ssl/certs /etc/ssl/certs
            --proc /proc --tmpfs /dev --dev-bind /dev/null /dev/null --dev-bind /dev/zero /dev/zero --dev-bind /dev/random /dev/random --dev-bind /dev/urandom /dev/urandom --dir /dev/shm --chmod 1777 /dev/shm
            --dir /work --bind "$exec_dir" /work --dir /tmp --bind "$exec_dir/tmp" /tmp --dir /workspace --ro-bind "$V4_WORKSPACE" /workspace --dir /trusted --ro-bind "$launcher" /trusted/bazel --ro-bind "$source_status" /trusted/source-status --ro-bind "$sandbox_script" /trusted/run
            --uid 65534 --gid 65534 --chdir /workspace
            --setenv PATH /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin --setenv HOME /work/home --setenv USER nobody --setenv LOGNAME nobody --setenv TMPDIR /tmp --setenv RUNNER_TEMP /tmp --setenv CI true --setenv GITHUB_ACTIONS true
            --setenv BAZEL_BIN /trusted/bazel --setenv BAZELISK_SKIP_WRAPPER 1 --setenv BAZEL_OUTPUT_BASE /work/output-base --setenv GF_FLYWHEEL_LOCAL_ENV_MODE forbid --setenv GF_BAZEL_JOBS 4 --setenv GF_BAZEL_REMOTE_UPLOAD "$REMOTE_UPLOAD" --setenv GF_BAZEL_REMOTE_EXECUTION_PLATFORM gloriousflywheel-rbe-linux-x86_64
            --setenv GF_FLYWHEEL_PROFILE_STATE executor-backed --setenv GF_BAZEL_SUBSTRATE_MODE executor-backed --setenv GF_REAPI_CREDENTIAL_HELPER_TOKEN_FILE /work/cell-token.jwt --setenv BAZEL_REMOTE_CACHE "$V4_REMOTE_ENDPOINT" --setenv BAZEL_REMOTE_EXECUTOR "$V4_REMOTE_ENDPOINT" --setenv BAZEL_REMOTE_INSTANCE_NAME "$V4_INSTANCE" --setenv BAZEL_CREDENTIAL_HELPER "$V4_HELPER_SCOPE=$V4_CREDHELPER"
            --setenv GF_VERIFY_BIN "$V4_VERIFIER" --setenv GF_BAZEL_WRAPPER "$V4_WRAPPER" /trusted/run
          )
          IFS= read -r command_token </proc/sys/kernel/random/uuid; [[ "$command_token" =~ ^[0-9a-f-]{36}$ ]] || refuse "workflow-command stop token is unavailable"
          printf '::stop-commands::%s\n' "$command_token"; if "$bwrap" "${bwrap_args[@]}"; then sandbox_status=0; else sandbox_status=$?; fi; printf '::%s::\n' "$command_token"
          ((sandbox_status == 0)) || refuse "isolated OCI build session failed"
        }

        if [[ "${V4_BOUNDARY_STAGE:-}" == stage2 ]]; then
          stage2_build
        else

        [[ "$ARTIFACT_NAME" == "v4-oci-layout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" ]] || refuse "artifact filename is not the run-derived canonical name"
        git_bin="$(command -v git)" || refuse "required preinstalled Git executable is absent"
        [[ -x "$git_bin" ]] || refuse "required preinstalled Git executable is not executable"
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$("$git_bin" rev-parse --verify 'HEAD^{commit}')" == "$SOURCE_SHA" ]] || refuse "OCI build source is not the exact admitted checkout"
        build_date="$("$git_bin" show -s --format=%cI "$SOURCE_SHA")"
        [[ "$build_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[+-][0-9]{2}:[0-9]{2}$ ]] || refuse "source commit date is not strict ISO-8601"
        case "$EVENT_NAME" in
          pull_request)
            [[ "$PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || refuse "fork pull requests cannot build a publication artifact"
            [[ "$REMOTE_UPLOAD" == false ]] || refuse "pull-request builds must set GF_BAZEL_REMOTE_UPLOAD=false"
            ;;
          push)
            [[ "$EVENT_REF" == refs/heads/main && "$REMOTE_UPLOAD" == true ]] || refuse "only a main push may set GF_BAZEL_REMOTE_UPLOAD=true"
            ;;
          *) refuse "unsupported build event: $EVENT_NAME" ;;
        esac
        [[ "$(id -u)" == 0 ]] || refuse "v4 OCI construction requires a root runner boundary"
        system_tool /usr/bin/env
        system_tool /bin/bash
        [[ "$(awk '$1 == "NoNewPrivs:" { print $2 }' /proc/self/status)" == 1 ]] || refuse "runner must enforce no-new-privileges"
        trap cleanup EXIT
        for tool in jq stat wc id readlink mktemp rm mkdir find python3; do
          command -v "$tool" >/dev/null || refuse "required preinstalled tool is absent: $tool"
        done
        [[ -x /usr/bin/sha256sum ]] || refuse "required system SHA-256 executable is absent: /usr/bin/sha256sum"
        [[ -x /usr/bin/tar ]] || refuse "required system tar executable is absent: /usr/bin/tar"
        /usr/bin/tar --version | grep -q 'GNU tar' || refuse "deterministic archive creation requires image-supplied GNU tar"
        [[ -f tinyland.repo.json && ! -L tinyland.repo.json ]] || refuse "tinyland.repo.json is absent or not a regular file"
        [[ "$(jq -er '.enrollment.executionPool' tinyland.repo.json)" == tinyland-nix ]] || refuse "tinyland.repo.json enrollment.executionPool must be tinyland-nix"
        [[ "$(jq -er '.enrollment.substrateMode' tinyland.repo.json)" == executor-backed ]] || refuse "tinyland.repo.json enrollment.substrateMode must be executor-backed"
        [[ ! -e .env.flywheel.local && ! -L .env.flywheel.local ]] || refuse "v4 forbids the workspace .env.flywheel.local fallback fixture"
        [[ -n "${GF_REAPI_TOKEN_EXCHANGE_ENDPOINT:-}" ]] || refuse "runtime token-exchange authority is absent"
        [[ -n "${GF_REAPI_CACHE_FRONTDOOR_ENDPOINT:-}" ]] || refuse "runtime executor front-door authority is absent"
        [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || refuse "GitHub OIDC environment is absent; permissions.id-token must remain write"

        oidc_profile_bin=/usr/local/bin/flywheel-github-oidc-profile
        [[ -f "$oidc_profile_bin" && ! -L "$oidc_profile_bin" && -x "$oidc_profile_bin" ]] || refuse "OIDC profile helper is absent or not the regular image-installed executable"
        [[ "$(stat -c '%u:%g:%a' "$oidc_profile_bin")" == 0:0:555 ]] || refuse "OIDC profile helper must be root:root mode 0555"
        oidc_profile_sha256="$(read_root_receipt /etc/tinyland/gf-client-flywheel-github-oidc-profile-sha256 "OIDC profile helper")"
        [[ "$oidc_profile_sha256" =~ ^[0-9a-f]{64}$ ]] || refuse "OIDC profile helper receipt is not one lowercase SHA-256 digest"
        oidc_profile_sha256_record="$(/usr/bin/sha256sum "$oidc_profile_bin")" || refuse "OIDC profile helper could not be hashed"
        [[ "${oidc_profile_sha256_record%% *}" == "$oidc_profile_sha256" ]] || refuse "OIDC profile helper digest disagrees with its image receipt"
        client_source_hash="$(read_root_receipt /etc/tinyland/gf-client-tools-source-nar-hash "client-tools source")"
        [[ "$client_source_hash" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]] || refuse "client-tools source receipt is not one SHA-256 SRI hash"
        credhelper_bin="$(custody_store_tool gf-reapi-credhelper)"
        flywheel_verify_bin="$(custody_store_tool flywheel-verify)"
        gloriousflywheel_bazel_bin="$(custody_store_tool gloriousflywheel-bazel)"
        bwrap_bin="$(custody_store_tool bwrap)"
        [[ "$("$bwrap_bin" --version)" == "bubblewrap 0.11.2" ]] || refuse "bubblewrap version disagrees with the image contract"
        bazel_bin="$(read_root_receipt /etc/tinyland/ci-bazelisk-bin "runner image Bazelisk")"
        [[ "$bazel_bin" =~ ^/nix/store/[0-9abcdfghijklmnpqrsvwxyz]{32}-bazelisk-[A-Za-z0-9][A-Za-z0-9._+~-]*/bin/bazelisk$ ]] || refuse "runner image Bazelisk receipt does not name the exact packaged /nix/store executable"
        [[ -f "$bazel_bin" && ! -L "$bazel_bin" && -x "$bazel_bin" ]] || refuse "runner image Bazelisk path is not a regular executable"
        [[ "$(stat -c '%u:%g' "$bazel_bin")" == 0:0 ]] || refuse "runner image Bazelisk executable is not root:root-owned"
        bazel_bin_mode="$(stat -c '%a' "$bazel_bin")"
        (( (8#$bazel_bin_mode & 8#022) == 0 )) || refuse "runner image Bazelisk executable is group- or other-writable"

        umask 077
        isolation_root="$(mktemp -d "${RUNNER_TEMP:?}/v4-oci-isolation.XXXXXX")"
        chmod 0700 "$isolation_root"
        exec_dir="$isolation_root/execution"
        install -d -o 65534 -g 65534 -m 0700 "$exec_dir" "$exec_dir/home" "$exec_dir/tmp" "$exec_dir/output-user-root" "$exec_dir/output-base" "$exec_dir/symlinks"
        launcher="$isolation_root/bazel"
        printf '#!/bin/bash\nexec %q --output_user_root=/work/output-user-root "$@"\n' "$bazel_bin" >"$launcher"
        chmod 0555 "$launcher"
        token_dir="$(mktemp -d "${RUNNER_TEMP}/gf-reapi-v4-oci-build.XXXXXX")"
        profile_file="$token_dir/profile.env"
        unset GF_FLYWHEEL_PROFILE_STATE GF_BAZEL_SUBSTRATE_MODE GF_BAZEL_LOCAL_PROOF GF_FRONTDOOR_ENDPOINT
        unset BAZEL_REMOTE_CACHE BAZEL_REMOTE_EXECUTOR BAZEL_REMOTE_INSTANCE_NAME BAZEL_CREDENTIAL_HELPER GF_REAPI_CREDENTIAL_HELPER_TOKEN_FILE
        "$oidc_profile_bin" \
          --request executor \
          --ttl 1h \
          --frontdoor-endpoint "$GF_REAPI_CACHE_FRONTDOOR_ENDPOINT" \
          --credential-helper-bin "$credhelper_bin" \
          --token-dir "$token_dir" \
          --profile-out "$profile_file" \
          --github-output "" >/dev/null
        rm -f -- "$token_dir/github-oidc.curl" "$token_dir/github-oidc-response.json" "$token_dir/token-exchange.curl" "$token_dir/token-exchange-response.json"
        for raw in github-oidc.curl github-oidc-response.json token-exchange.curl token-exchange-response.json; do
          [[ ! -e "$token_dir/$raw" && ! -L "$token_dir/$raw" ]] || refuse "raw OIDC/exchange material survived mint"
        done
        summary_file="$token_dir/token-exchange-summary.json"
        [[ -f "$profile_file" && ! -L "$profile_file" && "$(stat -c '%u:%a' "$profile_file")" == 0:600 && -f "$summary_file" && ! -L "$summary_file" ]] || refuse "minted profile custody is invalid"
        remote_endpoint="$GF_REAPI_CACHE_FRONTDOOR_ENDPOINT"
        [[ -n "$remote_endpoint" && "$remote_endpoint" != *$'\n'* && "$remote_endpoint" != *$'\r'* ]] || refuse "executor endpoint is malformed"
        instance_name="$(jq -er '.instance_name | select(type=="string" and length>0)' "$summary_file")" || refuse "token exchange returned no tenant instance"
        credential_helper="$(jq -er '.credential_helper | select(type=="string" and length>0)' "$summary_file")" || refuse "token exchange returned no credential helper"
        credential_scope="${credential_helper%%=*}"
        [[ -n "$credential_scope" && "$credential_helper" != *$'\n'* && "$credential_helper" != *$'\r'* && "${credential_helper#*=}" == "$credhelper_bin" ]] || refuse "minted credential helper is not custody-validated"
        token_file="$token_dir/gf-reapi-cell-token.jwt"
        [[ -f "$token_file" && ! -L "$token_file" ]] || refuse "minted cell token is outside its custody directory"
        cell_token="$exec_dir/cell-token.jwt"
        install -o 65534 -g 65534 -m 0600 "$token_file" "$cell_token"
        rm -rf -- "$token_dir"
        token_dir=""

        [[ -z "$(find "$GITHUB_WORKSPACE" -xdev ! -uid 0 -print -quit)" ]] || refuse "admitted source is not root-owned"
        script="$0"; [[ -f "$script" && ! -L "$script" && "$(stat -c '%u:%g' "$script")" == 0:0 ]] || refuse "trusted re-entry script is invalid"
        script_mode="$(stat -c '%a' "$script")"; (( (8#$script_mode & 8#022) == 0 )) || refuse "trusted re-entry script is writable outside root"
        exec /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin V4_BOUNDARY_STAGE=stage2 \
          V4_ISOLATION_ROOT="$isolation_root" V4_WORKSPACE="$GITHUB_WORKSPACE" V4_REMOTE_UPLOAD="$REMOTE_UPLOAD" V4_ARTIFACT_NAME="$ARTIFACT_NAME" V4_RUNNER_TEMP="$RUNNER_TEMP" \
          V4_SOURCE_SHA="$SOURCE_SHA" V4_BUILD_DATE="$build_date" V4_SOURCE_REPOSITORY="$GITHUB_REPOSITORY" \
          V4_REMOTE_ENDPOINT="$remote_endpoint" V4_INSTANCE="$instance_name" V4_HELPER_SCOPE="$credential_scope" V4_CREDHELPER="$credhelper_bin" V4_VERIFIER="$flywheel_verify_bin" V4_WRAPPER="$gloriousflywheel_bazel_bin" \
          V4_GITHUB_OUTPUT="$GITHUB_OUTPUT" V4_GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" /bin/bash --noprofile --norc "$script"
        fi

        bazel_bin_link="$exec_dir/symlinks/bazel-bin"; [[ -L "$bazel_bin_link" ]] || refuse "Bazel output link is absent"
        bazel_bin_target="$(readlink "$bazel_bin_link")"
        if [[ "$bazel_bin_target" == /work/* ]]; then bazel_bin_host="$exec_dir/${bazel_bin_target#/work/}"; elif [[ "$bazel_bin_target" != /* ]]; then bazel_bin_host="$(dirname "$bazel_bin_link")/$bazel_bin_target"; else refuse "Bazel output link escaped the sandbox output root"; fi
        bazel_bin_host="$(readlink -f "$bazel_bin_host")" || refuse "Bazel output link did not resolve"
        [[ "$bazel_bin_host" == "$exec_dir/output-base/"* ]] || refuse "Bazel output link resolved outside the isolated output base"
        layout="$(readlink -f "$bazel_bin_host/oci_publish_bundle")" || refuse "//:oci_publish_bundle did not produce its fixed output"
        digest_file="$(readlink -f "$bazel_bin_host/oci_publish_bundle.json.sha256")" || refuse "//:oci_publish_bundle.digest did not produce its fixed digest output"
        [[ "$layout" == "$exec_dir/output-base/"* && "$digest_file" == "$exec_dir/output-base/"* ]] || refuse "OCI outputs resolved outside the isolated Bazel output base"
        [[ -d "$layout" && ! -L "$layout" ]] || refuse "//:oci_publish_bundle output is not one OCI layout directory"
        [[ -f "$digest_file" && ! -L "$digest_file" ]] || refuse "//:oci_publish_bundle.digest output is not one regular file"

        image_digest="$(LAYOUT="$layout" DIGEST_FILE="$digest_file" SOURCE_SHA="$SOURCE_SHA" BUILD_DATE="$BUILD_DATE" SOURCE_REPOSITORY="$SOURCE_REPOSITORY" python3 - <<'PY'
        import hashlib
        import json
        import os
        import re
        import stat
        from pathlib import Path

        layout = Path(os.environ["LAYOUT"])
        digest_file = Path(os.environ["DIGEST_FILE"])
        digest_re = re.compile(r"sha256:[0-9a-f]{64}")

        for root, dirs, files in os.walk(layout, followlinks=False):
            for name in dirs + files:
                path = Path(root, name)
                mode = path.lstat().st_mode
                if stat.S_ISLNK(mode) or not (stat.S_ISDIR(mode) or stat.S_ISREG(mode)):
                    raise SystemExit(f"OCI layout contains a symlink or special file: {path.relative_to(layout)}")

        def read_json(path: Path):
            if not path.is_file() or path.is_symlink():
                raise SystemExit(f"missing regular OCI JSON file: {path.relative_to(layout)}")
            return json.loads(path.read_text(encoding="utf-8"))

        if read_json(layout / "oci-layout") != {"imageLayoutVersion": "1.0.0"}:
            raise SystemExit("oci-layout must be exactly OCI layout 1.0.0")
        index = read_json(layout / "index.json")
        manifests = index.get("manifests")
        if index.get("schemaVersion") != 2 or not isinstance(manifests, list) or len(manifests) != 1:
            raise SystemExit("OCI index must carry exactly one manifest")

        referenced = set()

        def descriptor_blob(descriptor, label, expected_media_type=None, layer=False):
            if not isinstance(descriptor, dict):
                raise SystemExit(f"{label} descriptor is not an object")
            digest = descriptor.get("digest")
            size = descriptor.get("size")
            media_type = descriptor.get("mediaType")
            if not isinstance(digest, str) or digest_re.fullmatch(digest) is None:
                raise SystemExit(f"{label} descriptor digest is malformed")
            if not isinstance(size, int) or isinstance(size, bool) or size < 0:
                raise SystemExit(f"{label} descriptor size is malformed")
            if expected_media_type is not None and media_type != expected_media_type:
                raise SystemExit(f"{label} descriptor has the wrong media type")
            if layer and media_type not in {
                "application/vnd.oci.image.layer.v1.tar",
                "application/vnd.oci.image.layer.v1.tar+gzip",
                "application/vnd.oci.image.layer.v1.tar+zstd",
            }:
                raise SystemExit(f"{label} descriptor has a non-OCI layer media type")
            path = layout / "blobs" / "sha256" / digest.removeprefix("sha256:")
            if not path.is_file() or path.is_symlink():
                raise SystemExit(f"{label} descriptor blob is absent or not regular")
            hasher = hashlib.sha256()
            with path.open("rb") as stream:
                for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                    hasher.update(chunk)
            if path.stat().st_size != size or hasher.hexdigest() != digest.removeprefix("sha256:"):
                raise SystemExit(f"{label} descriptor bytes disagree with size/digest")
            referenced.add(path.relative_to(layout).as_posix())
            return path

        manifest_descriptor = manifests[0]
        if manifest_descriptor.get("mediaType") != "application/vnd.oci.image.manifest.v1+json":
            raise SystemExit("OCI index must reference one OCI image manifest")
        manifest = json.loads(descriptor_blob(
            manifest_descriptor,
            "manifest",
            "application/vnd.oci.image.manifest.v1+json",
        ).read_text(encoding="utf-8"))
        if manifest.get("schemaVersion") != 2 or manifest.get("mediaType") != "application/vnd.oci.image.manifest.v1+json":
            raise SystemExit("image manifest has the wrong schema or media type")
        config_path = descriptor_blob(
            manifest.get("config"),
            "config",
            "application/vnd.oci.image.config.v1+json",
        )
        config = json.loads(config_path.read_text(encoding="utf-8"))
        config_values = config.get("config")
        if not isinstance(config_values, dict):
            raise SystemExit("image config payload is not an object")
        environment = config_values.get("Env")
        if not isinstance(environment, list) or any(not isinstance(item, str) or "=" not in item for item in environment):
            raise SystemExit("image runtime environment is malformed")
        environment_pairs = [item.split("=", 1) for item in environment]
        if len({key for key, _ in environment_pairs}) != len(environment_pairs):
            raise SystemExit("image runtime environment contains duplicate keys")
        runtime_env = dict(environment_pairs)
        labels = config_values.get("Labels")
        if not isinstance(labels, dict) or any(not isinstance(key, str) or not isinstance(value, str) for key, value in labels.items()):
            raise SystemExit("image labels are malformed")
        expected_sha = os.environ["SOURCE_SHA"]
        expected_date = os.environ["BUILD_DATE"]
        expected_ref = f"source-{expected_sha}"
        expected_source = f"https://github.com/{os.environ['SOURCE_REPOSITORY']}"
        if runtime_env.get("BUILD_COMMIT_SHA") != expected_sha or runtime_env.get("BUILD_COMMIT_REF") != expected_ref or runtime_env.get("BUILD_DATE") != expected_date:
            raise SystemExit("image runtime provenance disagrees with the admitted source")
        if labels.get("org.opencontainers.image.source") != expected_source or labels.get("org.opencontainers.image.revision") != expected_sha or labels.get("org.opencontainers.image.created") != expected_date:
            raise SystemExit("image OCI provenance labels disagree with the admitted source")
        layers = manifest.get("layers")
        if not isinstance(layers, list):
            raise SystemExit("image manifest layers must be an array")
        for index_number, layer in enumerate(layers):
            descriptor_blob(layer, f"layer[{index_number}]", layer=True)

        actual_blobs = {
            path.relative_to(layout).as_posix()
            for path in (layout / "blobs" / "sha256").iterdir()
            if path.is_file() and not path.is_symlink()
        }
        if actual_blobs != referenced:
            raise SystemExit("OCI layout contains unreferenced or missing blobs")
        allowed_files = {"oci-layout", "index.json"} | referenced
        actual_files = {
            path.relative_to(layout).as_posix()
            for path in layout.rglob("*")
            if path.is_file() and not path.is_symlink()
        }
        if actual_files != allowed_files:
            raise SystemExit("OCI layout contains an unexpected file")
        actual_dirs = {
            path.relative_to(layout).as_posix()
            for path in layout.rglob("*")
            if path.is_dir() and not path.is_symlink()
        }
        if actual_dirs != {"blobs", "blobs/sha256"}:
            raise SystemExit("OCI layout contains an unexpected directory")

        image_digest = manifest_descriptor["digest"]
        recorded = digest_file.read_text(encoding="utf-8").strip()
        if recorded != image_digest:
            raise SystemExit("generated .digest target disagrees with the validated OCI descriptor")
        print(image_digest)
        PY
        )" || refuse "//:oci_publish_bundle failed complete OCI descriptor validation"
        [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || refuse "validated OCI image digest is malformed"

        artifact_path="${RUNNER_TEMP}/${ARTIFACT_NAME}"
        [[ ! -e "$artifact_path" && ! -L "$artifact_path" ]] || refuse "canonical artifact path already exists"
        TZ=UTC /usr/bin/tar \
          --sort=name \
          --mtime='@0' \
          --owner=0 \
          --group=0 \
          --numeric-owner \
          --format=gnu \
          -C "$layout" \
          -cf "$artifact_path" .
        [[ -f "$artifact_path" && ! -L "$artifact_path" && -s "$artifact_path" ]] || refuse "deterministic OCI archive was not created"
        artifact_sha256="$(/usr/bin/sha256sum "$artifact_path")"
        artifact_sha256="${artifact_sha256%% *}"
        [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]] || refuse "OCI archive SHA-256 is malformed"
        {
          echo "artifact_path=$artifact_path"
          echo "artifact_sha256=sha256:$artifact_sha256"
          echo "image_digest=$image_digest"
        } >>"$GITHUB_OUTPUT"
        {
          echo "### V4 inert OCI bundle"
          echo
          echo "- Target: \`//:oci_publish_bundle\`"
          echo "- Manifest: \`$image_digest\`"
          echo "- Archive: \`sha256:$artifact_sha256\`"
          echo "- Cache upload: \`$REMOTE_UPLOAD\`"
          echo "- Registry authority: none"
        } >>"$GITHUB_STEP_SUMMARY"
