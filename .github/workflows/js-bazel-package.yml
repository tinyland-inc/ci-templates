name: JS Bzlmod Package

on:
  workflow_call:
    outputs: {}
    inputs:
      runner_mode:
        description: >-
          Runner policy for validation jobs: compat, shared, or
          repo_owned. TIN-3914 retired `hosted`: the estate has no
          GitHub-hosted runners, so every mode resolves to a self-hosted
          capability class and `hosted` is rejected with a migration error.
        type: string
        default: "compat"
      shared_runner_labels_json:
        description: "JSON array of shared GloriousFlywheel runner labels used when runner_mode=shared"
        type: string
        default: '["tinyland-docker"]'
      runner_labels_json:
        description: >-
          JSON array of capability-class runner labels used by compat mode
          and required when runner_mode=repo_owned. Empty (the default)
          means "unset" and resolves to the estate base class
          ["tinyland-nix"]. GitHub-hosted labels are rejected (TIN-3914);
          the pre-TIN-3914 default was the GitHub-hosted Ubuntu label.
        type: string
        default: ""
      bazel_targets:
        description: "Space-delimited Bazel targets to validate"
        type: string
        default: "//:pkg"
      bazel_fetch_retry_attempts:
        description: "Bazel validation attempts for transient external archive fetch failures"
        type: string
        default: "3"
      trusted_module_owners:
        description: "Comma-separated GitHub owners whose github.com, raw.githubusercontent.com, and api.github.com/repos/<owner> source URIs receive the read token via the Bazel credential helper. Org-parameterized (TIN-2353); tinyland-inc remains the default."
        type: string
        default: "tinyland-inc"
      verify_bzlmod_lock:
        description: >-
          Opt-in (default false) committed MODULE.bazel.lock verification. On a
          GF self-hosted capability runner, require the tracked lock, run
          `$CI_BAZELISK_BIN mod deps --lockfile_mode=update`, fail on
          drift, and validate Bazel targets with `--lockfile_mode=error`.
        type: boolean
        default: false
      emit_bzlmod_lock_artifact:
        description: >-
          Opt-in (default false) remote MODULE.bazel.lock refresh. On a GF
          self-hosted capability runner, preserve any existing lock, run
          `$CI_BAZELISK_BIN mod deps --lockfile_mode=update`, validate Bazel targets
          with `--lockfile_mode=error`, and upload the resulting lock once as
          the bzlmod-lock artifact.
        type: boolean
        default: false
      cache_backed:
        description: >-
          Opt-in (default false) shared-cache-backed Bazel validation. When true,
          the Bazel target validation runs through the cache-attachment contract
          (fail-closed) and `--config=ci-cached --remote_cache=$BAZEL_REMOTE_CACHE
          --remote_upload_local_results=false`, reading the shared Bazel cache.
          CACHE-FIRST only: no remote executor is wired. When false/unset,
          targets use the same GF/Nix Bazelisk front door without cache flags.
        type: boolean
        default: false
      substrate_mode:
        description: >-
          Optional operator override for the cache-backed lane's expected Bazel
          substrate mode (compatibility-local-only | shared-cache-backed |
          executor-backed). Used ONLY when cache_backed=true AND the consumer's
          tinyland.repo.json does not declare enrollment.substrateMode (which is
          the authoritative source, TIN-2109). When empty and the manifest is
          silent, the lane defaults to shared-cache-backed. Has no effect on the
          default (non-cache-backed) path.
        type: string
        default: ""
    secrets:
      TINYLAND_REGISTRY_GITHUB_TOKEN:
        description: "GitHub token with read access to private tinyland-inc Bazel module tarballs"
        required: false

permissions:
  contents: read

jobs:
  resolve-runner:
    # Fork PR code never reaches a GF self-hosted runner.
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    # TIN-3914: the label-resolution job itself runs on the estate base
    # capability class. It is the job every other job reads its runs-on from,
    # so leaving it hosted would have kept a GitHub-hosted runner on the
    # critical path of every single invocation.
    runs-on: tinyland-nix
    timeout-minutes: 5
    outputs:
      validate_runner_labels_json: ${{ steps.resolve.outputs.validate_runner_labels_json }}
    steps:
      - name: Resolve runner labels
        id: resolve
        shell: bash
        env:
          RUNNER_MODE: ${{ inputs.runner_mode }}
          RUNNER_LABELS_JSON: ${{ inputs.runner_labels_json }}
          SHARED_RUNNER_LABELS_JSON: ${{ inputs.shared_runner_labels_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          runner_mode = os.environ.get("RUNNER_MODE") or "compat"
          shared_runner_labels_raw = os.environ.get("SHARED_RUNNER_LABELS_JSON")

          if runner_mode == "hosted":
              raise SystemExit(
                  "runner_mode=hosted was retired by TIN-3914 (the estate has no GitHub-hosted runners). Use compat/shared/repo_owned with a self-hosted capability class; see docs/migration-v2-to-v3.md"
              )

          if runner_mode not in {"compat", "shared", "repo_owned"}:
              raise SystemExit(f"Unsupported runner_mode: {runner_mode}")

          if runner_mode == "shared" and shared_runner_labels_raw is not None and not shared_runner_labels_raw.strip():
              raise SystemExit(
                  "runner_mode=shared requires shared_runner_labels_json; "
                  "an empty value usually means the caller repo variable is unset"
              )

          def parse_labels(name: str, fallback: str) -> list[str]:
              raw = os.environ.get(name) or fallback
              try:
                  labels = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{name} must be a JSON array: {exc}") from exc

              if (
                  not isinstance(labels, list)
                  or not labels
                  or not all(isinstance(label, str) and label for label in labels)
              ):
                  raise SystemExit(f"{name} must be a non-empty JSON array of strings")

              return labels

          org_capability_label = re.compile(
              r"^[a-z0-9][a-z0-9-]*-(nix|nix-heavy|nix-kvm|nix-gpu|docker|dind)$"
          )
          # TIN-3914: fail closed on a GitHub-hosted label in EVERY mode, not
          # just the capability-required ones. There is no hosted lane left to
          # degrade to, so a hosted label is a routing error, never a fallback.
          github_hosted_label = re.compile(r"^(ubuntu|macos|windows)-", re.IGNORECASE)

          def reject_hosted(labels: list[str], name: str) -> None:
              hosted = [label for label in labels if github_hosted_label.match(label)]
              if hosted:
                  raise SystemExit(
                      f"{name} contains GitHub-hosted runner label(s) "
                      f"{hosted}; the estate runs only on GF cache-fronted "
                      "self-hosted runners (TIN-3914)"
                  )

          def require_org_capability(labels: list[str], name: str) -> None:
              if not any(org_capability_label.fullmatch(label) for label in labels):
                  raise SystemExit(
                      f"{name} must include an org capability-class label "
                      "(<org-pool>-nix|-nix-heavy|-nix-kvm|-nix-gpu|-docker|-dind)"
                  )

          runner_labels = parse_labels("RUNNER_LABELS_JSON", '["tinyland-nix"]')
          shared_runner_labels = parse_labels(
              "SHARED_RUNNER_LABELS_JSON",
              '["tinyland-docker"]',
          )

          # Check each list under its OWN name, before selection: in shared
          # mode validate_runner_labels IS shared_runner_labels, so blaming
          # "runner_labels_json" would name an input the caller never set.
          reject_hosted(runner_labels, "runner_labels_json")
          reject_hosted(shared_runner_labels, "shared_runner_labels_json")

          if runner_mode == "shared":
              validate_runner_labels = shared_runner_labels
          else:
              validate_runner_labels = runner_labels

          if runner_mode == "repo_owned" and not (os.environ.get("RUNNER_LABELS_JSON") or "").strip():
              raise SystemExit("runner_mode=repo_owned requires explicit runner_labels_json")

          if runner_mode == "repo_owned":
              require_org_capability(validate_runner_labels, "runner_labels_json")
          elif runner_mode == "shared":
              require_org_capability(validate_runner_labels, "shared_runner_labels_json")


          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(
                  "validate_runner_labels_json="
                  + json.dumps(validate_runner_labels, separators=(",", ":")),
                  file=output,
              )
          PY

  validate:
    needs: resolve-runner
    runs-on: ${{ fromJson(needs.resolve-runner.outputs.validate_runner_labels_json) }}
    timeout-minutes: 30
    env:
      BAZEL_FETCH_RETRY_ATTEMPTS: ${{ inputs.bazel_fetch_retry_attempts || '3' }}
    steps:
      - name: Validate workflow contract
        shell: bash
        env:
          RUNNER_MODE: ${{ inputs.runner_mode }}
          RUNNER_LABELS_JSON: ${{ inputs.runner_labels_json }}
          SHARED_RUNNER_LABELS_JSON: ${{ inputs.shared_runner_labels_json }}
          BAZEL_FETCH_RETRY_ATTEMPTS: ${{ inputs.bazel_fetch_retry_attempts || '3' }}
          BAZEL_TARGETS: ${{ inputs.bazel_targets || '//:pkg' }}
        run: |
          set -euo pipefail
          case "$RUNNER_MODE" in
            compat|shared|repo_owned) ;;
            hosted)
              echo "runner_mode=hosted was retired by TIN-3914 (the estate has no GitHub-hosted runners). Use compat/shared/repo_owned with a self-hosted capability class; see docs/migration-v2-to-v3.md" >&2
              exit 1
              ;;
            *)
              echo "Unsupported runner_mode: $RUNNER_MODE" >&2
              exit 1
              ;;
          esac
          if [ "$RUNNER_MODE" = "shared" ] && [ -z "${SHARED_RUNNER_LABELS_JSON//[[:space:]]/}" ]; then
            echo "runner_mode=shared requires shared_runner_labels_json; an empty value usually means the caller repo variable is unset" >&2
            exit 1
          fi
          case "$BAZEL_FETCH_RETRY_ATTEMPTS" in
            ""|*[!0-9]*)
              echo "bazel_fetch_retry_attempts must be a positive integer" >&2
              exit 1
              ;;
          esac
          if [ "$BAZEL_FETCH_RETRY_ATTEMPTS" -lt 1 ] || [ "$BAZEL_FETCH_RETRY_ATTEMPTS" -gt 5 ]; then
            echo "bazel_fetch_retry_attempts must be between 1 and 5" >&2
            exit 1
          fi
          read -r -a bazel_targets <<< "$BAZEL_TARGETS"
          if [ "${#bazel_targets[@]}" -eq 0 ]; then
            echo "bazel_targets must contain at least one Bazel target" >&2
            exit 1
          fi
          for target in "${bazel_targets[@]}"; do
            case "$target" in
              -*) echo "bazel_targets accepts targets, not Bazel flags: $target" >&2; exit 1 ;;
              //*|@*//*) ;;
              *) echo "bazel_targets contains an invalid target pattern: $target" >&2; exit 1 ;;
            esac
          done
          if [ "$RUNNER_MODE" = "repo_owned" ] && [ -z "${RUNNER_LABELS_JSON//[[:space:]]/}" ]; then
            echo "runner_mode=repo_owned requires explicit runner_labels_json" >&2
            exit 1
          fi
          if printf '%s\n%s\n' "$RUNNER_LABELS_JSON" "$SHARED_RUNNER_LABELS_JSON" \
            | grep -Eqi '"[[:space:]]*(ubuntu|macos|windows)-'; then
            echo "GitHub-hosted runner labels are forbidden estate-wide (TIN-3914); pass a self-hosted capability class" >&2
            exit 1
          fi
          if [ "$RUNNER_MODE" = "repo_owned" ] || [ "$RUNNER_MODE" = "shared" ]; then
            if [ "$RUNNER_MODE" = "repo_owned" ]; then
              labels_json="$RUNNER_LABELS_JSON"
              labels_name="runner_labels_json"
            else
              labels_json="$SHARED_RUNNER_LABELS_JSON"
              labels_name="shared_runner_labels_json"
            fi
            LABELS_JSON="$labels_json" LABELS_NAME="$labels_name" python3 - <<'PY'
          import json
          import os
          import re
          import sys

          labels_name = os.environ["LABELS_NAME"]
          labels_raw = os.environ.get("LABELS_JSON") or ""
          try:
              labels = json.loads(labels_raw)
          except json.JSONDecodeError as exc:
              print(f"{labels_name} must be a JSON array: {exc}", file=sys.stderr)
              raise SystemExit(1) from exc

          org_capability_label = re.compile(
              r"^[a-z0-9][a-z0-9-]*-(nix|nix-heavy|nix-kvm|nix-gpu|docker|dind)$"
          )
          if not isinstance(labels, list) or not any(
              isinstance(label, str) and org_capability_label.fullmatch(label)
              for label in labels
          ):
              print(
                  f"{labels_name} must include an org capability-class label "
                  "(<org-pool>-nix|-nix-heavy|-nix-kvm|-nix-gpu|-docker|-dind)",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
          fi

      - name: Configure self-hosted cache contract
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@v3.1.0

      - name: Resolve runner-custodied Bazelisk
        id: bazelisk-custody
        uses: tinyland-inc/ci-templates/.github/actions/rust-bazel-binary-custody@v3.1.0

      - name: Bind exact Bazelisk path
        shell: bash
        env:
          CI_BAZELISK_BIN: ${{ steps.bazelisk-custody.outputs.path }}
        run: |
          set -euo pipefail
          printf 'CI_BAZELISK_BIN=%s\n' "$CI_BAZELISK_BIN" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          persist-credentials: false

      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::checkout $actual != expected source $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Stage isolated graph-proof workspace
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE_DIR="$RUNNER_TEMP/js-bzlmod-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          mkdir "$WORKSPACE_DIR"
          cp -a "$GITHUB_WORKSPACE"/. "$WORKSPACE_DIR"
          echo "WORKSPACE_DIR=$WORKSPACE_DIR" >> "$GITHUB_ENV"

      - name: Install Bazel fetch retry helper
        shell: bash
        run: |
          set -euo pipefail
          helper_path="$RUNNER_TEMP/js-bazel-package-bazel-fetch-retry.sh"
          cat > "$helper_path" <<'BASH'
          is_transient_bazel_fetch_failure() {
            local log_path="$1"
            grep -Eiq "(Error downloading|GET returned 5[0-9][0-9]|Bad Gateway|Proxy Error|connection reset|Connection timed out|TLS handshake timeout|Temporary failure)" "$log_path"
          }

          run_with_bazel_fetch_retry() {
            local label="$1"
            local command="$2"
            local attempts="${BAZEL_FETCH_RETRY_ATTEMPTS:-3}"
            local attempt=1
            local slug

            slug="$(printf '%s' "$label" | tr '[:upper:]' '[:lower:]' | tr -cs '[:alnum:]' '-' | sed -E 's/^-+//; s/-+$//')"
            if [ -z "$slug" ]; then
              slug="command"
            fi

            while [ "$attempt" -le "$attempts" ]; do
              local log_path="$RUNNER_TEMP/js-bazel-package-${slug}-attempt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${attempt}.log"
              set +e
              bash -e -u -o pipefail -c "$command" 2>&1 | tee "$log_path"
              local status="${PIPESTATUS[0]}"
              set -e

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if [ "$attempt" -eq "$attempts" ]; then
                echo "::error::$label failed after $attempts attempt(s)."
                return "$status"
              fi

              if ! is_transient_bazel_fetch_failure "$log_path"; then
                echo "::error::$label failed with a non-fetch error; not retrying."
                return "$status"
              fi

              echo "::warning::$label hit a transient Bazel external fetch/download failure on attempt $attempt/$attempts; retrying."
              "$CI_BAZELISK_BIN" shutdown >/dev/null 2>&1 || true
              sleep 10
              attempt=$((attempt + 1))
            done
          }
          BASH
          echo "BAZEL_FETCH_RETRY_HELPER=$helper_path" >> "$GITHUB_ENV"

      - name: Install Bazel GitHub credential helper
        shell: bash
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ secrets.TINYLAND_REGISTRY_GITHUB_TOKEN || github.token }}
          BAZEL_TRUSTED_MODULE_OWNERS: ${{ inputs.trusted_module_owners }}
        run: |
          set -euo pipefail
          cd "$WORKSPACE_DIR"

          helper_path="$RUNNER_TEMP/js-bazel-package-github-credential-helper"
          cat > "$helper_path" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "${1:-}" != "get" ]; then
            echo "unsupported credential helper command: ${1:-<missing>}" >&2
            exit 1
          fi

          request_json="$(cat)"
          REQUEST_JSON="$request_json" python3 - <<'PY'
          import json
          import os

          try:
              request = json.loads(os.environ.get("REQUEST_JSON") or "{}")
          except json.JSONDecodeError:
              request = {}

          uri = str(request.get("uri") or "")
          token = os.environ.get("TINYLAND_REGISTRY_GITHUB_TOKEN") or ""

          owners = [
              o.strip().lower()
              for o in (os.environ.get("BAZEL_TRUSTED_MODULE_OWNERS") or "tinyland-inc").split(",")
              if o.strip()
          ]
          prefixes = tuple(
              prefix
              for owner in owners
              for prefix in (
                  f"https://github.com/{owner}/",
                  f"https://raw.githubusercontent.com/{owner}/",
                  f"https://api.github.com/repos/{owner}/",
              )
          )

          if token and uri.lower().startswith(prefixes):
              print(json.dumps({"headers": {"Authorization": [f"Bearer {token}"]}}))
          else:
              print(json.dumps({"headers": {}}))
          PY
          BASH
          chmod +x "$helper_path"

          {
            echo "common --credential_helper=github.com=$helper_path"
            echo "common --credential_helper=raw.githubusercontent.com=$helper_path"
            echo "common --credential_helper=api.github.com=$helper_path"
          } >> user.bazelrc

          if [ -n "${TINYLAND_REGISTRY_GITHUB_TOKEN:-}" ]; then
            {
              printf 'TINYLAND_REGISTRY_GITHUB_TOKEN=%s\n' "$TINYLAND_REGISTRY_GITHUB_TOKEN"
              printf 'BAZEL_GITHUB_CREDENTIAL_HELPER=%s\n' "$helper_path"
              printf 'BAZEL_TRUSTED_MODULE_OWNERS=%s\n' "${BAZEL_TRUSTED_MODULE_OWNERS:-tinyland-inc}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No GitHub token is available for private Bazel module tarball fetches."
          fi

      # Optional cache-backed manifest gate; v4 remains cache-first and GF-only.
      # The vendored schema validates tinyland.repo.json without network access.
      - name: Validate repo manifest (cache-backed lane)
        if: ${{ inputs.cache_backed }}
        uses: tinyland-inc/ci-templates/.github/actions/repo-manifest-validate@5959c1230caab03fa324fc45e4829d7122a0e107
        with:
          path: ${{ env.WORKSPACE_DIR }}/tinyland.repo.json

      # Optional shared-cache validation executes only the immutable template
      # contract. Caller scripts and network-fetched shell never become authority.
      - name: Assert shared-cache attachment (cache-backed lane)
        if: ${{ inputs.cache_backed }}
        uses: tinyland-inc/ci-templates/.github/actions/cache-attachment-validate@v3.1.0
        with:
          substrate_mode: ${{ inputs.substrate_mode }}
          runner_labels: ${{ join(runner.labels, ',') }}

      - name: Refresh or verify Bzlmod lock (GF only)
        if: ${{ inputs.verify_bzlmod_lock || inputs.emit_bzlmod_lock_artifact }}
        shell: bash
        env:
          VERIFY_BZLMOD_LOCK: ${{ inputs.verify_bzlmod_lock }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_LABELS: ${{ join(runner.labels, ',') }}
        run: |
          set -euo pipefail
          cd "$WORKSPACE_DIR"

          if [ "$RUNNER_ENVIRONMENT" != "self-hosted" ] \
            || [[ ! ",$RUNNER_LABELS," =~ ,[a-z0-9][a-z0-9-]*-(nix|nix-heavy|nix-kvm|nix-gpu|docker|dind), ]]; then
            echo "::error::Bzlmod lock refresh/verification requires a GF self-hosted capability runner."
            exit 1
          fi
          if [ ! -f MODULE.bazel ]; then
            echo "::error::Bzlmod lock refresh/verification requires MODULE.bazel at the workspace root."
            exit 1
          fi

          if [ "$VERIFY_BZLMOD_LOCK" = "true" ]; then
            if ! git ls-files --error-unmatch -- MODULE.bazel.lock >/dev/null 2>&1; then
              echo "::error::verify_bzlmod_lock=true requires a tracked MODULE.bazel.lock."
              exit 1
            fi
            if [ -n "$(git status --porcelain=v1 -- MODULE.bazel.lock)" ]; then
              echo "::error::MODULE.bazel.lock was dirty before committed-lock verification."
              exit 1
            fi
          fi

          # shellcheck source=/dev/null
          source "$BAZEL_FETCH_RETRY_HELPER"
          run_with_bazel_fetch_retry "Refresh Bzlmod lock" \
            "\"$CI_BAZELISK_BIN\" mod deps --lockfile_mode=update"

          if [ ! -f MODULE.bazel.lock ]; then
            echo "::error::Bazel did not produce MODULE.bazel.lock."
            exit 1
          fi
          if [ "$VERIFY_BZLMOD_LOCK" = "true" ] \
            && [ -n "$(git status --porcelain=v1 -- MODULE.bazel.lock)" ]; then
            git --no-pager diff -- MODULE.bazel.lock
            echo "::error::Bzlmod lock drift detected; download a remote refresh artifact and commit it."
            exit 1
          fi

      - name: Validate Bazel targets
        if: ${{ !inputs.cache_backed }}
        shell: bash
        env:
          BAZEL_TARGETS: ${{ inputs.bazel_targets || '//:pkg' }}
          ENFORCE_BZLMOD_LOCK: ${{ inputs.verify_bzlmod_lock || inputs.emit_bzlmod_lock_artifact }}
        run: |
          set -euo pipefail
          cd "$WORKSPACE_DIR"
          # shellcheck disable=SC2153
          read -r -a bazel_targets <<< "$BAZEL_TARGETS"

          # shellcheck source=/dev/null
          source "$BAZEL_FETCH_RETRY_HELPER"
          targets_quoted="$(printf '%q ' "${bazel_targets[@]}")"
          if [ "$ENFORCE_BZLMOD_LOCK" = "true" ]; then
            run_with_bazel_fetch_retry "Validate Bazel targets" "\"$CI_BAZELISK_BIN\" build ${targets_quoted}--lockfile_mode=error --verbose_failures"
          else
            run_with_bazel_fetch_retry "Validate Bazel targets" "\"$CI_BAZELISK_BIN\" build ${targets_quoted}--verbose_failures"
          fi

      - name: Validate Bazel targets (cache-backed)
        if: ${{ inputs.cache_backed }}
        shell: bash
        env:
          BAZEL_TARGETS: ${{ inputs.bazel_targets || '//:pkg' }}
          ENFORCE_BZLMOD_LOCK: ${{ inputs.verify_bzlmod_lock || inputs.emit_bzlmod_lock_artifact }}
        run: |
          set -euo pipefail
          cd "$WORKSPACE_DIR"
          if [ -z "${BAZEL_REMOTE_CACHE:-}" ]; then
            echo "::error::cache_backed=true but BAZEL_REMOTE_CACHE is unset. On self-hosted cluster runners nix-setup exports it from cluster DNS; otherwise supply it via repo/org secret or input. The cache-backed lane fails closed rather than silently building local-only."
            exit 1
          fi
          # shellcheck disable=SC2153
          read -r -a bazel_targets <<< "$BAZEL_TARGETS"

          # shellcheck source=/dev/null
          source "$BAZEL_FETCH_RETRY_HELPER"
          targets_quoted="$(printf '%q ' "${bazel_targets[@]}")"
          # CACHE-FIRST: ci-cached config + injected remote cache, read-only
          # (no upload), and no remote executor is wired. The remote cache
          # hit/transfer lines in this step's log are the real-attach proof.
          if [ "$ENFORCE_BZLMOD_LOCK" = "true" ]; then
            run_with_bazel_fetch_retry "Validate Bazel targets (cache-backed)" \
              "\"$CI_BAZELISK_BIN\" build ${targets_quoted}--lockfile_mode=error --config=ci-cached --remote_cache=${BAZEL_REMOTE_CACHE} --remote_upload_local_results=false --verbose_failures"
          else
            run_with_bazel_fetch_retry "Validate Bazel targets (cache-backed)" \
              "\"$CI_BAZELISK_BIN\" build ${targets_quoted}--config=ci-cached --remote_cache=${BAZEL_REMOTE_CACHE} --remote_upload_local_results=false --verbose_failures"
          fi

      - name: Confirm committed Bzlmod lock stayed unchanged
        if: ${{ inputs.verify_bzlmod_lock }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE_DIR"
          if [ -n "$(git status --porcelain=v1 -- MODULE.bazel.lock)" ]; then
            git --no-pager diff -- MODULE.bazel.lock
            echo "::error::MODULE.bazel.lock changed after committed-lock verification."
            exit 1
          fi

      - name: Upload refreshed Bzlmod lock
        if: ${{ inputs.emit_bzlmod_lock_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bzlmod-lock
          path: ${{ env.WORKSPACE_DIR }}/MODULE.bazel.lock
          if-no-files-found: error

      # TIN-89: no registry publication lives in this workflow. Release
      # authority is an immutable source tag/archive plus a reviewed BCR append.

