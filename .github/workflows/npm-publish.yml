# TIN-3914: this workflow no longer schedules on GitHub-hosted runners.
# All three jobs run on the estate base capability class `tinyland-nix`;
# `actions/setup-node` + `pnpm/action-setup` provide their own toolchains
# there, so no Nix devshell wiring is required. This template has no
# runner-class input and (as of the 2026-08-19 sweep) no caller, so the
# label is a literal rather than a new caller-facing contract.
name: NPM Publish

on:
  workflow_call:
    inputs:
      node-versions:
        description: "JSON array of Node.js versions to test"
        type: string
        default: '["20", "22"]'
      publish-node-version:
        description: "Node.js version used for publishing"
        type: string
        default: "22"
      pnpm-version:
        description: "pnpm version to install"
        type: string
        default: "9"
      registry-url:
        description: "npm registry URL for publishing"
        type: string
        default: "https://registry.npmjs.org"
    secrets:
      NPM_TOKEN:
        description: "npmjs.com publish token"
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: tinyland-nix
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(inputs.node-versions || '["20", "22"]') }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.4
        with:
          version: ${{ inputs.pnpm-version || '9' }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - run: pnpm build

      - name: Run tests (non-blocking)
        run: |
          if grep -q '"test"' package.json 2>/dev/null; then
            pnpm test || echo "::warning::Tests failed but continuing"
          else
            echo "No test script found, skipping"
          fi
        continue-on-error: true

      - name: Verify no source maps in package
        run: |
          if npm pack --dry-run 2>&1 | grep '\.js\.map'; then
            exit 1
          fi

  publish-gpr:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: tinyland-nix
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.4
        with:
          version: ${{ inputs.pnpm-version || '9' }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.publish-node-version || '22' }}
          registry-url: https://npm.pkg.github.com

      - name: Install and build
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
          pnpm build

      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: tinyland-nix
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.4
        with:
          version: ${{ inputs.pnpm-version || '9' }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.publish-node-version || '22' }}
          registry-url: ${{ inputs.registry-url || 'https://registry.npmjs.org' }}

      - name: Install and build
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
          pnpm build

      # TIN-3914 moved this job to a self-hosted runner. npm validates
      # provenance server-side by comparing the Runner Environment extension in
      # the Fulcio signing certificate against an allow-list that does not
      # include `self-hosted` — an OIDC token is obtainable there, the
      # attestation is still rejected. So requesting provenance off a
      # github-hosted runner makes the publish FAIL, not merely lose a claim.
      # Fails closed: only an explicit `github-hosted` environment opts in, so
      # an empty or unexpected value takes the no-provenance path.
      - name: Publish to npmjs
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            pnpm publish --no-git-checks --provenance
          else
            echo "::warning::npm provenance is NOT requested: this publish runs on a self-hosted runner and npm rejects a provenance attestation whose certificate Runner Environment is not github-hosted (TIN-3914). See docs/migration-v2-to-v3.md."
            pnpm publish --no-git-checks
          fi
