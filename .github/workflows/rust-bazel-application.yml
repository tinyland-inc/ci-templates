name: Rust Bazel Application

on:
  workflow_call:
    inputs:
      enabled:
        description: >-
          Explicit opt-in. False leaves this reusable workflow inert, preserving
          every non-caller and non-opted caller byte-for-byte.
        type: boolean
        default: false
      platform_matrix_json:
        description: >-
          Exact native platform matrix. Each entry requires name, os (darwin or
          linux), arch (aarch64 or x86_64), runner_labels (JSON array), and one
          exact bazel_platform label. No runner or platform is inferred.
        type: string
        default: "[]"
      required_bazel_major:
        description: Required major from the consumer's tracked .bazelversion.
        type: string
        default: "9"
      rustfmt_targets_json:
        description: Finite non-empty JSON array of exact Bazel rustfmt test labels.
        type: string
        default: "[]"
      clippy_targets_json:
        description: Finite non-empty JSON array of exact Bazel clippy test labels.
        type: string
        default: "[]"
      build_targets_json:
        description: Finite non-empty JSON array of exact Bazel application build labels.
        type: string
        default: "[]"
      unit_test_targets_json:
        description: Finite non-empty JSON array of exact Bazel unit-test labels.
        type: string
        default: "[]"
      integration_test_targets_json:
        description: Finite non-empty JSON array of exact Bazel integration-test labels.
        type: string
        default: "[]"
      package_targets_json:
        description: Finite non-empty JSON array of exact Bazel package build labels.
        type: string
        default: "[]"
      cache_enabled:
        description: >-
          Opt into the runtime GloriousFlywheel remote cache. False is local-only;
          true requires GF_BAZEL_REMOTE_CACHE and remains read-only unless the
          separate trusted upload gate passes.
        type: boolean
        default: false
      trusted_cache_upload:
        description: >-
          Permit cache writes only on a push to the protected main branch or a
          protected release tag. Pull requests remain read-only unconditionally.
        type: boolean
        default: false
      cache_substrate_mode:
        description: Expected cache mode when the consumer manifest is silent.
        type: string
        default: shared-cache-backed
      protected_branch:
        description: Protected branch name eligible for explicitly enabled cache writes.
        type: string
        default: main
      release_tag_prefix:
        description: Protected tag prefix eligible for explicitly enabled cache writes.
        type: string
        default: v
      timeout_minutes:
        description: Finite timeout for each native platform lane.
        type: number
        default: 60
      max_parallel:
        description: Maximum native platform lanes running concurrently.
        type: number
        default: 2
    secrets:
      GF_BAZEL_REMOTE_CACHE:
        description: Runtime remote-cache endpoint; required only when cache_enabled=true.
        required: false
      GF_BAZEL_REMOTE_HEADER:
        description: Optional runtime remote auth header.
        required: false
      GF_BAZEL_REMOTE_CACHE_HEADER:
        description: Optional runtime cache-specific auth header.
        required: false
      GF_BAZEL_CREDENTIAL_HELPER:
        description: Optional runtime Bazel credential-helper command.
        required: false

permissions:
  contents: read

jobs:
  native:
    if: inputs.enabled
    name: ${{ matrix.lane.name }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        lane: ${{ fromJSON(inputs.platform_matrix_json) }}
    runs-on: ${{ matrix.lane.runner_labels }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      BAZEL_REMOTE_CACHE: ${{ secrets.GF_BAZEL_REMOTE_CACHE }}
      GF_BAZEL_REMOTE_HEADER: ${{ secrets.GF_BAZEL_REMOTE_HEADER }}
      GF_BAZEL_REMOTE_CACHE_HEADER: ${{ secrets.GF_BAZEL_REMOTE_CACHE_HEADER }}
      GF_BAZEL_CREDENTIAL_HELPER: ${{ secrets.GF_BAZEL_CREDENTIAL_HELPER }}
    steps:
      - name: Check out exact caller revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate finite targets and native platform
        id: contract
        uses: tinyland-inc/ci-templates/.github/actions/rust-bazel-contract@v2
        with:
          lane_name: ${{ matrix.lane.name }}
          expected_os: ${{ matrix.lane.os }}
          expected_arch: ${{ matrix.lane.arch }}
          actual_os: ${{ runner.os }}
          actual_arch: ${{ runner.arch }}
          expected_runner_labels_json: ${{ toJSON(matrix.lane.runner_labels) }}
          bazel_platform: ${{ matrix.lane.bazel_platform }}
          required_bazel_major: ${{ inputs.required_bazel_major }}
          rustfmt_targets_json: ${{ inputs.rustfmt_targets_json }}
          clippy_targets_json: ${{ inputs.clippy_targets_json }}
          build_targets_json: ${{ inputs.build_targets_json }}
          unit_test_targets_json: ${{ inputs.unit_test_targets_json }}
          integration_test_targets_json: ${{ inputs.integration_test_targets_json }}
          package_targets_json: ${{ inputs.package_targets_json }}

      - name: Resolve fail-closed cache policy
        shell: bash
        env:
          CACHE_ENABLED: ${{ inputs.cache_enabled }}
          TRUSTED_CACHE_UPLOAD: ${{ inputs.trusted_cache_upload }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          PROTECTED_BRANCH: ${{ inputs.protected_branch }}
          RELEASE_TAG_PREFIX: ${{ inputs.release_tag_prefix }}
        run: |
          set -euo pipefail
          upload=false
          trusted_ref=false
          if [[ "$REF_NAME" == "refs/heads/$PROTECTED_BRANCH" ]]; then
            trusted_ref=true
          elif [[ -n "$RELEASE_TAG_PREFIX" && "$REF_NAME" == "refs/tags/$RELEASE_TAG_PREFIX"* ]]; then
            trusted_ref=true
          fi

          if [[ "$CACHE_ENABLED" == true &&
                "$TRUSTED_CACHE_UPLOAD" == true &&
                "$EVENT_NAME" == push &&
                "$REF_PROTECTED" == true &&
                "$trusted_ref" == true ]]; then
            upload=true
          fi
          echo "GF_BAZEL_REMOTE_UPLOAD=$upload" >> "$GITHUB_ENV"
          if [[ "$CACHE_ENABLED" != true ]]; then
            echo "::notice::Bazel remote cache disabled; this lane is local-only."
          elif [[ "$upload" == true ]]; then
            echo "::notice::Protected push ref admitted for trusted cache upload."
          else
            echo "::notice::Remote cache attached read-only (pull requests are always read-only)."
          fi

      - name: Assert runtime cache attachment
        if: inputs.cache_enabled
        uses: tinyland-inc/ci-templates/.github/actions/cache-attachment-validate@v2
        with:
          substrate_mode: ${{ inputs.cache_substrate_mode }}
          runner_labels: ${{ join(matrix.lane.runner_labels, ',') }}

      - name: Prove Bzlmod lock is current
        shell: bash
        run: |
          set -euo pipefail
          command -v bazelisk >/dev/null 2>&1 || {
            echo "::error::bazelisk is required on the selected native runner"
            exit 127
          }
          if [[ -n "$(git status --porcelain=v1 -- MODULE.bazel.lock)" ]]; then
            echo "::error::MODULE.bazel.lock was dirty before the lock-drift check"
            exit 1
          fi
          bazelisk mod deps --lockfile_mode=update
          if [[ -n "$(git status --porcelain=v1 -- MODULE.bazel.lock)" ]]; then
            git --no-pager diff -- MODULE.bazel.lock
            echo "::error::Bzlmod lock drift detected; regenerate and commit MODULE.bazel.lock"
            exit 1
          fi

      - name: Run exact Bazel Rust application targets
        shell: bash
        env:
          BAZEL_PLATFORM: ${{ matrix.lane.bazel_platform }}
          CACHE_ENABLED: ${{ inputs.cache_enabled }}
          RUSTFMT_TARGETS: ${{ steps.contract.outputs.rustfmt_targets }}
          CLIPPY_TARGETS: ${{ steps.contract.outputs.clippy_targets }}
          BUILD_TARGETS: ${{ steps.contract.outputs.build_targets }}
          UNIT_TEST_TARGETS: ${{ steps.contract.outputs.unit_test_targets }}
          INTEGRATION_TEST_TARGETS: ${{ steps.contract.outputs.integration_test_targets }}
          PACKAGE_TARGETS: ${{ steps.contract.outputs.package_targets }}
        run: |
          set -euo pipefail
          cache_args=()
          if [[ "$CACHE_ENABLED" == true ]]; then
            cache_args+=(--remote_cache="$BAZEL_REMOTE_CACHE")
            cache_args+=(--remote_upload_local_results="$GF_BAZEL_REMOTE_UPLOAD")
            cache_args+=(--remote_download_minimal --remote_timeout=60)
            if [[ -n "${GF_BAZEL_REMOTE_HEADER:-}" ]]; then
              cache_args+=(--remote_header="$GF_BAZEL_REMOTE_HEADER")
            fi
            if [[ -n "${GF_BAZEL_REMOTE_CACHE_HEADER:-}" ]]; then
              cache_args+=(--remote_cache_header="$GF_BAZEL_REMOTE_CACHE_HEADER")
            fi
            if [[ -n "${GF_BAZEL_CREDENTIAL_HELPER:-}" ]]; then
              cache_args+=(--credential_helper="$GF_BAZEL_CREDENTIAL_HELPER")
            fi
          fi

          run_group() {
            local display_name="$1"
            local command="$2"
            local raw_targets="$3"
            local targets=()
            read -r -a targets <<< "$raw_targets"
            local test_args=()
            if [[ "$command" == test ]]; then
              test_args+=(--test_output=errors)
            fi
            echo "::group::$display_name (${#targets[@]} exact target(s), platform=$BAZEL_PLATFORM)"
            bazelisk "$command" \
              --platforms="$BAZEL_PLATFORM" \
              --verbose_failures \
              "${test_args[@]}" \
              "${cache_args[@]}" \
              "${targets[@]}"
            echo "::endgroup::"
          }

          run_group "rustfmt" test "$RUSTFMT_TARGETS"
          run_group "clippy" test "$CLIPPY_TARGETS"
          run_group "application build" build "$BUILD_TARGETS"
          run_group "unit tests" test "$UNIT_TEST_TARGETS"
          run_group "integration tests" test "$INTEGRATION_TEST_TARGETS"
          run_group "packages" build "$PACKAGE_TARGETS"
