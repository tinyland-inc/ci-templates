name: Secrets Scan

# CT-03 (TIN-3397): dogfood ci-templates' own `.github/actions/secrets-scan`
# composite (TruffleHog + Gitleaks) as an enforced PR gate instead of a
# repo-manual `just secrets-scan-dir` step. Standalone workflow (the CT-03
# issue leaves "inside validate.yml or standalone" open) so this gate does
# not depend on CT-01 (#107) landing first — see the PR body for the
# sequencing note.
#
# Boundary with TIN-1577 (stated per the issue): TIN-1577 owns canonicalizing
# `.gitleaks.toml` and rolling `secrets-scan` across the fleet. This workflow
# owns exactly one thing — making ci-templates gate itself.
#
# PR mode scans only the PR's diff range (base.sha..head.sha); push-to-main
# mode scans full git history. Both modes fail closed on any finding and
# `--redact` keeps candidate secret values out of the job log — only the
# rule id and finding count are ever surfaced.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan (TruffleHog + Gitleaks)
    # tinyland-nix: matches CT-01's runner-class decision for this repo's
    # own PR-validation surface (see scripts/runner_label_taxonomy.rb and
    # site.scaffold's ci.yml -> spoke-ci.yml default_runner_class).
    runs-on: tinyland-nix
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: gitleaks needs both endpoints of the PR diff
          # range reachable locally, and the push:main path scans full
          # history by design.
          fetch-depth: 0

      - name: Resolve gitleaks scan range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            echo "log-opts=${base}..${head}" >> "$GITHUB_OUTPUT"
            echo "::notice::gitleaks PR-diff mode: ${base}..${head}"
          else
            echo "log-opts=" >> "$GITHUB_OUTPUT"
            echo "::notice::gitleaks full-history mode (push:main)"
          fi

      - name: Secrets scan (dogfoods this repo's own composite action)
        id: scan
        uses: ./.github/actions/secrets-scan
        with:
          gitleaks-log-opts: ${{ steps.range.outputs.log-opts }}

      - name: Summarize
        if: always()
        shell: bash
        run: |
          echo "gitleaks findings_count: ${{ steps.scan.outputs.findings_count }}"
