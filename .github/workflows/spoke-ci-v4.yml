name: spoke-ci-v4
# Immutable v4 action-fabric contract released under TIN-4249. The release
# publishes workflow source only; consumer adoption, provider convergence, and
# runtime proof remain separately verified product transactions.

on:
  workflow_call:
    inputs:
      action_name:
        description: Named action from the caller's checked-in .github/lanes.json.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  action-fabric:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: tinyland-nix
    timeout-minutes: 45
    env:
      SOURCE_SHA: '${{ fromJSON(format(''{{"pull_request":"{0}","push":"{1}"}}'', github.event.pull_request.head.sha, github.sha))[github.event_name] }}'
    steps:
      - name: Check out exact admitted source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The owner overlay and admission binding identify the exact PR head,
          # never GitHub's synthetic merge commit. Pushes bind github.sha.
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Execute declared Bazel action
        shell: bash
        env:
          ACTION_NAME: ${{ inputs.action_name }}
        run: |
          set -euo pipefail
          /usr/local/bin/gf-action-client run \
            --plan .github/lanes.json \
            --action "$ACTION_NAME" \
            --source-sha "$SOURCE_SHA"
