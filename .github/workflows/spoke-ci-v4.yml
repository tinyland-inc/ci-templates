name: spoke-ci-v4
# Source-only breaking contract authorized by TIN-2130. Publication, adoption,
# installation, and runtime proof are separate operator transactions.

on:
  workflow_call:
    inputs:
      action_name:
        description: Named action from the caller's checked-in .github/lanes.json.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  action-fabric:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: tinyland-nix
    timeout-minutes: 45
    steps:
      - name: Check out exact admitted source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # GitHub signs github.sha into the job's OIDC token. On a
          # pull_request event this is the synthetic merge commit, not the
          # untrusted head SHA. The resolver refuses any mismatch.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Execute declared Bazel actions
        shell: bash
        env:
          ACTION_NAME: ${{ inputs.action_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          /usr/local/bin/gf-action-client run \
            --plan .github/lanes.json \
            --action "$ACTION_NAME" \
            --source-sha "$SOURCE_SHA"
