name: spoke-ci
on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "22"
      pnpm_version:
        type: string
        default: "10.13.1"
      flywheel_config:
        type: string
        default: flywheel-executor
        description: One of flywheel | flywheel-executor | local. Per-lane override via lanes.json.
      cache_backed:
        description: >-
          Opt-in (default false) shared-cache-backed Bazel enrollment for the
          flywheel-build + bazel-graph jobs. When true, those jobs additionally
          (a) switch their Nix setup to nix-setup@v2 so BAZEL_REMOTE_CACHE is
          exported from cluster DNS, (b) validate tinyland.repo.json and assert
          shared-cache attachment via scripts/cache-attachment-contract.sh
          (fail-closed: contract --strict), and (c) run a cache-backed Bazel
          build of the flywheel-eligible targets with
          `--config=ci-cached --remote_cache=$BAZEL_REMOTE_CACHE
          --remote_upload_local_results=false` reading the shared Bazel cache.
          CACHE-FIRST only: no remote executor is wired. When false/unset the
          existing default path runs byte-identically (zero behavior change for
          non-opted spoke consumers). An opted spoke must also set
          flywheel_config: flywheel (not local) so flywheel-bazel forwards the
          remote cache.
        type: boolean
        default: false
      substrate_mode:
        description: >-
          Optional operator override for the cache-backed lane's expected Bazel
          substrate mode (compatibility-local-only | shared-cache-backed |
          executor-backed). Used ONLY when cache_backed=true AND the spoke's
          tinyland.repo.json does not declare enrollment.substrateMode (which is
          the authoritative source, TIN-2109). When empty and the manifest is
          silent, the lane defaults to shared-cache-backed. Has no effect on the
          default (non-cache-backed) path.
        type: string
        default: ""
      cache_backed_targets:
        description: >-
          Space-separated Bazel targets exercised by the cache-backed lane's
          real-attach build (cache_backed=true only). Defaults to the SvelteKit
          flywheel-eligible CAS surface. Ignored on the default path.
        type: string
        default: "//:node_modules //:sveltekit_types //:svelte_check_test"
      playwright_enabled:
        type: boolean
        default: false
      lanes_path:
        type: string
        default: .github/lanes.json
      default_runner_class:
        type: string
        default: tinyland-nix
        description: >-
          Base runner-class label. Used by the matrix jobs when
          `runner_labels_json` is unset and lanes.json doesn't override
          per-lane, and — since TIN-3914 retired the GitHub-hosted class — it
          is also the label the secrets-scan, lanes-load, and repo-manifest
          jobs run on. A tenant org whose pool is not `tinyland-nix` (e.g.
          Great-Falls-Tool-Bus) passes its served capability label here and
          every job follows.
      runner_labels_json:
        type: string
        default: ""
        description: |
          Optional JSON-array expression evaluating to the runs-on labels
          for matrix jobs. When set (non-empty), takes precedence over
          matrix.lane.runner_class and default_runner_class. Enables spokes
          that resolve their capability class from a repo/org variable to
          adopt the wrapper without losing their runner-routing logic.
          The string must be a JSON array. The receiver passes it
          through fromJSON when non-empty. Since TIN-3914 every label in it
          must be a self-hosted capability class. Any GitHub-hosted label
          family, including one hidden in a `fromJSON(vars.X || …)`
          fallback array, is a FAIL in `scripts/lint-runs-on.rb` — there is
          no hosted degrade path left.
          See README + the v1.1 release notes for an end-to-end caller example.
      heavy_runner_class:
        type: string
        default: tinyland-nix-heavy
        description: >-
          Runner-class label for the bazel-graph job. Org tenancies that only
          publish the base `tinyland-nix` capability label (the TIN-2299
          org-scope overlay shape, e.g. Great-Falls-Tool-Bus) pass their served
          label here instead of the tinyland-inc pool's heavy class. Default
          preserves pre-v2.8.1 behavior byte-identically.
      kvm_runner_class:
        type: string
        default: tinyland-nix-kvm
        description: >-
          Runner-class label for the playwright job (playwright_enabled=true
          only). Same org-tenancy rationale as heavy_runner_class. Default
          preserves pre-v2.8.1 behavior byte-identically.
      runner_group:
        type: string
        default: ""
        description: >-
          Optional owner-scoped GitHub Actions runner group. Default "" =
          today's label-only routing, byte-identical for every consumer that
          does not opt in (AGENTS.md rule 2). When non-empty, EVERY job —
          since TIN-3914 removed the GitHub-hosted class, that is all seven:
          secrets-scan, lanes-load, repo-manifest, flywheel-build,
          flywheel-test, bazel-graph, playwright — switches from a bare
          label/array `runs-on` to GitHub's structured
          `runs-on: { group: <runner_group>, labels: <the same labels this
          job resolves today> }`, composed at runtime via
          fromJSON(format(...)) because YAML cannot express a conditional
          mapping. The already-resolved labels are carried through toJSON, so
          `runner_labels_json` / `matrix.lane.runner_class` /
          `default_runner_class` / `heavy_runner_class` / `kvm_runner_class`
          keep their exact precedence and their string-vs-array shape. A
          group mapping matches only
          runners that are BOTH in that org-level runner group AND carry the
          labels, so the group must already exist, have this repository in its
          selection, and serve the capability label — workflow source is not
          proof of any of those. Generic groups (Default / shared /
          GitHub-hosted) are rejected by the runs-on linter.
      allowed_repo_roles:
        type: string
        default: static-spoke,static-spoke-scaffold
        description: >-
          Accepted `taxonomy.primary_role` values for the repo-manifest census,
          as a comma-separated list or a JSON array (both forms normalize
          identically; surrounding brackets, quotes, and whitespace are
          stripped). Threaded to BOTH census sites — the `repo-manifest` job and
          the `cache_backed` lane's manifest gate in `flywheel-build` — which
          were two independently hardcoded literals before TIN-3815, so a spoke
          could satisfy one and fail the other.

          Default is exactly the pre-TIN-3815 literal, so every consumer that
          does not opt in renders byte-identically (AGENTS.md rule 2), proved by
          `just repo-role-census-contract-check`.

          `app-stateful-spoke` is deliberately NOT in the default. The role is
          ratified in the vendored manifest schema's `$defs.repoRole`, but
          ratification of a ROLE is not ratification of a TEMPLATE BINDING: the
          schema's `allOf` block constrains `static-spoke`/`static-spoke-scaffold`
          to `owns_runtime_backend/owns_auth/owns_payments/... == false` and
          deliberately omits `app-stateful-spoke`, so the two families are not
          interchangeable, and this census is the only place in ci-templates
          where `primary_role` is enforced at all. An app-stateful spoke that
          wants this lane says so in one line:

            allowed_repo_roles: static-spoke,static-spoke-scaffold,app-stateful-spoke
      gitleaks_config:
        type: string
        default: .gitleaks.toml
    secrets:
      ATTIC_TOKEN:
        required: false

# Permissions: `statuses: write` for lane-status-check; `contents: read` is
# enough for the rest. PRs from forks land with read-only token; status
# posting will fail gracefully in those cases.
permissions:
  contents: read
  statuses: write

concurrency:
  group: spoke-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    # TIN-3914: the estate runs only on GF cache-fronted self-hosted runners,
    # so this job routes through the base capability class like every other
    # job. runner_group unset (default): the trailing arm renders the plain
    # `default_runner_class` label. Set: the SAME label inside GitHub's
    # structured `runs-on: {group, labels}` mapping.
    runs-on: >-
      ${{ inputs.runner_group != '' &&
      fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON(inputs.runner_group), toJSON(inputs.default_runner_class)))
      || inputs.default_runner_class }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: tinyland-inc/ci-templates/.github/actions/secrets-scan@v2

  lanes-load:
    # Base capability class, group-routed on opt-in (see secrets-scan).
    runs-on: >-
      ${{ inputs.runner_group != '' &&
      fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON(inputs.runner_group), toJSON(inputs.default_runner_class)))
      || inputs.default_runner_class }}
    timeout-minutes: 5
    outputs:
      lanes_json: ${{ steps.load.outputs.lanes_json }}
      lane_count: ${{ steps.load.outputs.lane_count }}
      schema_version: ${{ steps.load.outputs.schema_version }}
      spoke_name: ${{ steps.load.outputs.spoke_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: tinyland-inc/ci-templates/.github/actions/setup-nix@v2
      - id: load
        uses: tinyland-inc/ci-templates/.github/actions/lanes-load@v2
        with:
          path: ${{ inputs.lanes_path }}

  repo-manifest:
    # Base capability class, group-routed on opt-in (see secrets-scan).
    runs-on: >-
      ${{ inputs.runner_group != '' &&
      fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON(inputs.runner_group), toJSON(inputs.default_runner_class)))
      || inputs.default_runner_class }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: tinyland-inc/ci-templates/.github/actions/setup-nix@v2
      - id: manifest
        shell: bash
        run: |
          if [[ -f tinyland.repo.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tinyland.repo.json not present; skipping manifest validation for this pre-manifest consumer."
          fi
      - if: steps.manifest.outputs.exists == 'true'
        uses: tinyland-inc/ci-templates/.github/actions/repo-manifest-validate@v2
        with:
          required_roles: ${{ inputs.allowed_repo_roles }}

  flywheel-build:
    needs: [secrets-scan, repo-manifest, lanes-load]
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJson(needs.lanes-load.outputs.lanes_json) }}
    # runner_group unset (default): the trailing arm is byte-for-byte the
    # pre-runner_group expression, so `false && … ||` short-circuits straight
    # into it. Set: the SAME resolved labels are carried into GitHub's
    # structured `runs-on: {group, labels}` via toJSON (string or array).
    runs-on: >-
      ${{ inputs.runner_group != '' &&
      fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON(inputs.runner_group),
      toJSON(inputs.runner_labels_json != '' && fromJSON(inputs.runner_labels_json) || matrix.lane.runner_class || inputs.default_runner_class)))
      || inputs.runner_labels_json != '' && fromJSON(inputs.runner_labels_json) || matrix.lane.runner_class || inputs.default_runner_class }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # Default path (cache_backed=false): byte-identical setup for the ~34
      # non-opted spoke consumers. setup-nix installs Nix only; it does NOT
      # export BAZEL_REMOTE_CACHE.
      - if: ${{ !inputs.cache_backed }}
        uses: tinyland-inc/ci-templates/.github/actions/setup-nix@v2

      # Cache-backed path (cache_backed=true): nix-setup probes cluster DNS and
      # exports BAZEL_REMOTE_CACHE / ATTIC_SERVER so the contract + cache-backed
      # build below can attach the shared Bazel cache. This is the spoke wiring
      # fix: spoke-ci's default setup-nix does not export the cache endpoint.
      - if: ${{ inputs.cache_backed }}
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@v2

      - name: Setup workspace
        run: nix develop --command just setup

      # --- Opt-in (cache_backed=true) enrollment gate. NEW conditional steps; ---
      # --- the default flywheel-bazel + just build steps below are untouched.  ---

      # (a) Validate the spoke's tinyland.repo.json against the vendored schema
      # and FAIL CLOSED on an invalid manifest (TIN-2109). Network-free.
      - name: Validate repo manifest (cache-backed lane)
        if: ${{ inputs.cache_backed }}
        uses: tinyland-inc/ci-templates/.github/actions/repo-manifest-validate@v2
        with:
          required_roles: ${{ inputs.allowed_repo_roles }}

      # (b) Assert shared-cache attachment. Manifest-driven expected mode
      # (TIN-2109): authority order enrollment.substrateMode > substrate_mode
      # input > shared-cache-backed default. Runner labels are fed so the
      # contract rejects hosted / non-cluster fallback (no silent degrade).
      - name: Assert shared-cache attachment (cache-backed lane)
        if: ${{ inputs.cache_backed }}
        shell: bash
        env:
          CI_TEMPLATES_REF: v2.5.1
          SUBSTRATE_MODE_INPUT: ${{ inputs.substrate_mode }}
          RUNNER_LABELS: ${{ join(runner.labels, ',') }}
        run: |
          set -euo pipefail
          # The contract script ships in this ci-templates repo; prefer the
          # spoke's vendored copy, else fetch the immutable pinned copy
          # (CI_TEMPLATES_REF is the releasing tag, not floating v2).
          script="$RUNNER_TEMP/cache-attachment-contract.sh"
          if [ -f "scripts/cache-attachment-contract.sh" ]; then
            script="scripts/cache-attachment-contract.sh"
          else
            curl -fsSL \
              "https://raw.githubusercontent.com/tinyland-inc/ci-templates/${CI_TEMPLATES_REF}/scripts/cache-attachment-contract.sh" \
              -o "$script"
            chmod +x "$script"
          fi

          declared_mode=""
          if [ -f tinyland.repo.json ]; then
            declared_mode="$(jq -r '.enrollment.substrateMode // empty' tinyland.repo.json)"
          fi
          if [ -z "$declared_mode" ]; then
            declared_mode="$SUBSTRATE_MODE_INPUT"
          fi
          export GF_BAZEL_SUBSTRATE_MODE="${declared_mode:-shared-cache-backed}"
          export GF_FLYWHEEL_PROFILE_STATE="$GF_BAZEL_SUBSTRATE_MODE"
          echo "GF_FLYWHEEL_PROFILE_STATE=$GF_FLYWHEEL_PROFILE_STATE" >> "$GITHUB_ENV"
          echo "::notice::cache-backed lane expected mode (manifest-driven): $GF_BAZEL_SUBSTRATE_MODE"
          echo "::notice::Flywheel profile state: $GF_FLYWHEEL_PROFILE_STATE"

          export GF_BAZEL_RUNNER_LABELS="$RUNNER_LABELS"
          bash "$script" --strict

      - name: Build (flywheel)
        uses: tinyland-inc/ci-templates/.github/actions/flywheel-bazel@v2
        with:
          targets: "//:node_modules"
          command: build
          config: ${{ inputs.flywheel_config }}
          target_class: sveltekit-app-build

      # (c) Cache-backed real-attach build. Fails closed if BAZEL_REMOTE_CACHE is
      # unset. Runs the flywheel-eligible CAS targets through --config=ci-cached
      # with the validated remote cache, read-only (no upload). The spoke's
      # `build:ci --disk_cache=` makes a green build prove the REMOTE cache, not
      # an incidental local-disk hit. The remote-cache hit/transfer lines in
      # this step's log are the real-attach proof.
      - name: Validate Bazel targets (cache-backed)
        if: ${{ inputs.cache_backed }}
        shell: bash
        env:
          BAZEL_TARGETS: ${{ inputs.cache_backed_targets }}
        run: |
          set -euo pipefail
          if [ -z "${BAZEL_REMOTE_CACHE:-}" ]; then
            echo "::error::cache_backed=true but BAZEL_REMOTE_CACHE is unset. nix-setup exports it from cluster DNS on self-hosted runners; the cache-backed lane fails closed rather than silently building local-only."
            exit 1
          fi
          # CACHE-FIRST: ci-cached config + injected remote cache, read-only
          # (no upload); no remote executor is wired.
          nix develop --command bazelisk build ${BAZEL_TARGETS} \
            --config=ci-cached \
            --remote_cache="${BAZEL_REMOTE_CACHE}" \
            --remote_upload_local_results=false \
            --verbose_failures

      - name: Static site build
        run: nix develop --command just build

      - name: Post lane build status
        if: always()
        uses: tinyland-inc/ci-templates/.github/actions/lane-status-check@v2
        with:
          commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          lane_name: ${{ matrix.lane.name }}
          state: ${{ job.status == 'success' && 'success' || 'failure' }}
          description: "build-and-test (${{ matrix.lane.name }})"

  flywheel-test:
    needs: [secrets-scan, repo-manifest, lanes-load]
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJson(needs.lanes-load.outputs.lanes_json) }}
    # runner_group unset (default): the trailing arm is byte-for-byte the
    # pre-runner_group expression, so `false && … ||` short-circuits straight
    # into it. Set: the SAME resolved labels are carried into GitHub's
    # structured `runs-on: {group, labels}` via toJSON (string or array).
    runs-on: >-
      ${{ inputs.runner_group != '' &&
      fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON(inputs.runner_group),
      toJSON(inputs.runner_labels_json != '' && fromJSON(inputs.runner_labels_json) || matrix.lane.runner_class || inputs.default_runner_class)))
      || inputs.runner_labels_json != '' && fromJSON(inputs.runner_labels_json) || matrix.lane.runner_class || inputs.default_runner_class }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: tinyland-inc/ci-templates/.github/actions/setup-nix@v2

      - run: nix develop --command just setup
      - run: nix develop --command just check

  bazel-graph:
    needs: [secrets-scan]
    # Same default-off shape as the matrix jobs (see flywheel-build).
    runs-on: >-
      ${{ inputs.runner_group != '' &&
      fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON(inputs.runner_group), toJSON(inputs.heavy_runner_class)))
      || inputs.heavy_runner_class }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Default path (cache_backed=false): byte-identical for non-opted spokes.
      - if: ${{ !inputs.cache_backed }}
        uses: tinyland-inc/ci-templates/.github/actions/setup-nix@v2
      # Cache-backed path: nix-setup exports BAZEL_REMOTE_CACHE from cluster DNS.
      - if: ${{ inputs.cache_backed }}
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@v2

      - run: nix develop --command bazelisk mod graph

      # Default path: plain local build (untouched, byte-identical).
      - if: ${{ !inputs.cache_backed }}
        run: nix develop --command bazelisk build //:node_modules

      # Cache-backed path: same target read through the validated shared cache.
      # tinyland-nix-heavy is a cluster capability class accepted by the contract.
      - name: Assert shared-cache attachment (bazel-graph)
        if: ${{ inputs.cache_backed }}
        shell: bash
        env:
          CI_TEMPLATES_REF: v2.5.1
          SUBSTRATE_MODE_INPUT: ${{ inputs.substrate_mode }}
          RUNNER_LABELS: ${{ join(runner.labels, ',') }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/cache-attachment-contract.sh"
          if [ -f "scripts/cache-attachment-contract.sh" ]; then
            script="scripts/cache-attachment-contract.sh"
          else
            curl -fsSL \
              "https://raw.githubusercontent.com/tinyland-inc/ci-templates/${CI_TEMPLATES_REF}/scripts/cache-attachment-contract.sh" \
              -o "$script"
            chmod +x "$script"
          fi
          declared_mode=""
          if [ -f tinyland.repo.json ]; then
            declared_mode="$(jq -r '.enrollment.substrateMode // empty' tinyland.repo.json)"
          fi
          if [ -z "$declared_mode" ]; then
            declared_mode="$SUBSTRATE_MODE_INPUT"
          fi
          export GF_BAZEL_SUBSTRATE_MODE="${declared_mode:-shared-cache-backed}"
          export GF_FLYWHEEL_PROFILE_STATE="$GF_BAZEL_SUBSTRATE_MODE"
          echo "GF_FLYWHEEL_PROFILE_STATE=$GF_FLYWHEEL_PROFILE_STATE" >> "$GITHUB_ENV"
          echo "::notice::Flywheel profile state: $GF_FLYWHEEL_PROFILE_STATE"
          export GF_BAZEL_RUNNER_LABELS="$RUNNER_LABELS"
          bash "$script" --strict

      - name: Build //:node_modules (cache-backed)
        if: ${{ inputs.cache_backed }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BAZEL_REMOTE_CACHE:-}" ]; then
            echo "::error::cache_backed=true but BAZEL_REMOTE_CACHE is unset; failing closed rather than building local-only."
            exit 1
          fi
          nix develop --command bazelisk build //:node_modules \
            --config=ci-cached \
            --remote_cache="${BAZEL_REMOTE_CACHE}" \
            --remote_upload_local_results=false \
            --verbose_failures

  playwright:
    if: ${{ inputs.playwright_enabled }}
    needs: [flywheel-build, lanes-load]
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJson(needs.lanes-load.outputs.lanes_json) }}
    # Same default-off shape as the matrix jobs (see flywheel-build).
    runs-on: >-
      ${{ inputs.runner_group != '' &&
      fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON(inputs.runner_group), toJSON(inputs.kvm_runner_class)))
      || inputs.kvm_runner_class }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: tinyland-inc/ci-templates/.github/actions/setup-nix@v2
      - run: nix develop --command just setup
      - run: nix develop --command just test-e2e
