name: spoke-gitops-stack

# TIN-2597 GITOPS-STACK CHASSIS. ONE parameterized reusable workflow
# condensed from FIVE byte-near-identical copies in
# Great-Falls-Tool-Bus/great-falls-tool-bus-infra
# (.github/workflows/{mail-crs,list-crs,form-crs,archive-stack,web-stack}.yml)
# plus the shape Medical-Massage-Specialists' pr-env-lifecycle /
# application-apply-ceremony lanes converge on independently. Read against
# each: mail-crs.yml, list-crs.yml, form-crs.yml and archive-stack.yml are
# the SAME FILE with four strings swapped (stack name, k8s/<dir>, just verb
# prefix, protected-environment secret display name) -- diffed 2026-08-13,
# zero other deltas. web-stack.yml is the same two-job chassis
# (validate -> gated apply) with three additive capabilities layered on:
# a fail-closed typed confirm sentinel, a resolved-image input (CD and
# manual dispatch converge on one job env), and an in-cluster health gate.
# This workflow keeps the four-file shape as the DEFAULT path and makes
# each web-stack addition an explicit opt-in input, so it is the superset,
# not a fifth divergent shape.
#
# WHAT THIS DOES NOT DO: it does not decide when to fire (that is every
# caller's own on: block -- workflow_dispatch, push, or the CD
# repository_dispatch signal web-stack.yml receives from its site repo all
# stay in the THIN caller file, one per stack, in the overlay repo). It does
# not know what a stack's manifests must assert (that stays
# scripts/validate-<stack>.sh in the overlay repo -- see the sibling
# gitops-manifest-validate composite for the templated HELPER shape those
# scripts can adopt, independent of whether the overlay adopts this
# workflow). It does not mint or store the apply credential (that is the
# protected-environment secret the caller maps in, via the credential-gate
# composite this workflow calls). Same posture as every other file in this
# repo: express the shared chassis, absorb none of the tenant content.
#
# THE APPLY STEP IS A THIN SINGLE-VERB GATE ON PURPOSE (R172-R174 EXPRESS-
# not-ABSORB posture). Today "apply" resolves to one nix-job step running
# `just <just_recipe_prefix>-apply` -- an overlay-owned Justfile recipe, not
# raw kubectl in this file. When the TIN-2609 owner-overlay controller's
# Accept/Refuse operand-class interface lands, that is a ONE-LINE swap
# inside the SAME step (the recipe becomes `gf-controller accept <operand>`
# or the run fails on `refuse`) -- this chassis grows no new ceremony to
# absorb it, because it was never doing more than calling one verb.

on:
  workflow_call:
    inputs:
      stack_name:
        description: "Display name for job naming and the step summary, e.g. \"Archive Stack\"."
        type: string
        required: true
      stack_dir:
        description: "k8s overlay directory this stack validates/applies, e.g. k8s/archive. Documentation + step-summary only in the default (Justfile-delegating) validate path."
        type: string
        required: true
      just_recipe_prefix:
        description: >-
          Justfile recipe prefix. Verbs called: <prefix>-validate,
          <prefix>-server-dry-run, <prefix>-apply, and (if has_health_gate)
          <prefix>-health. Matches today's archive-stack / form-stack /
          list-stack / web-stack naming; mail-crs.yml is the one irregular
          case (its recipes are mail-cr-*, not mail-crs-*) -- pass the
          recipe prefix as it actually exists in the overlay's Justfile, not
          a derived guess.
        type: string
        required: true
      protected_environment:
        description: "GitHub environment gating the server/apply job, e.g. mail, web-apply."
        type: string
        required: true
      gf_core_ref:
        description: "Pinned tinyland-inc/GloriousFlywheel commit SHA (verified before every job runs, matching today's GF_CORE_REF + \"Verify GloriousFlywheel core checkout\" step)."
        type: string
        required: true
      kubeconfig_secret_display_name:
        description: "Primary kubeconfig secret's name, for the credential-gate error message (e.g. MAIL_APPLY_KUBECONFIG_B64)."
        type: string
        required: true
      kubeconfig_secret_display_name_alias:
        description: "Compatibility-alias secret name for the error message. Empty = no alias documented (web-stack today)."
        type: string
        required: false
        default: ""
      kubeconfig_env_var_name:
        description: >-
          Env var name the overlay's own <prefix>-server-dry-run/-apply/-health
          Justfile recipes read the materialized kubeconfig path from --
          THEIR name, verbatim, not a chassis-invented one (e.g.
          GFTB_MAIL_KUBECONFIG for mail-cr/list-stack/form-stack/
          archive-stack -- all four read this exact var per GFTB's Justfile
          `_mail-kubeconfig-inputs` recipe -- or WEB_APPLY_KUBECONFIG for
          web-stack). Exported into every later step's shell environment via
          GITHUB_ENV under this exact name; the four/five source stacks do
          not share one name, so this has no safe default.
        type: string
        required: true
      remediation_ref:
        description: "Doc/contract path naming where to provision the kubeconfig secret, surfaced in the credential-gate error."
        type: string
        required: false
        default: ""
      rewrite_in_cluster_server:
        description: "Passthrough to gitops-credential-gate. false for web-stack's tailnet-routed SA kubeconfig."
        type: boolean
        required: false
        default: true
      action:
        description: "server-dry-run (default) or apply. Caller forwards its own workflow_dispatch `action` choice input here unchanged."
        type: string
        required: false
        default: "server-dry-run"
      has_health_gate:
        description: >-
          Run <prefix>-health after apply and publish it to the step summary
          (web-stack.yml's In-cluster health gate step). Defaults true --
          web-stack.yml, the one source file this capability comes from,
          runs it unconditionally, so a caller with no <prefix>-health
          Justfile recipe (today: mail-cr/list-stack/form-stack/
          archive-stack) must explicitly pass false rather than the chassis
          silently skipping a gate its origin required.
        type: boolean
        required: false
        default: true
      require_confirm_sentinel:
        description: >-
          Require a typed confirm=apply sentinel before any apply step
          (web-stack.yml's fail-closed dispatch gate). Caller forwards its
          own `confirm` dispatch input via the confirm_value input below.
          Defaults true to match web-stack.yml's unconditional posture; a
          caller with no equivalent dispatch input (today:
          mail-cr/list-stack/form-stack/archive-stack) must explicitly pass
          false, an audited opt-out rather than a silent omission.
        type: boolean
        required: false
        default: true
      confirm_value:
        description: "The operator-typed sentinel value, checked only when require_confirm_sentinel is true. Must equal \"apply\"."
        type: string
        required: false
        default: ""
      apply_image:
        description: "Optional resolved image reference forwarded into the server-dry-run/apply job env as WEB_APPLY_IMAGE -- web-stack.yml's own Justfile var name, verbatim (web-stack.yml's digest-pinned image input)."
        type: string
        required: false
        default: ""
      apply_replicas:
        description: "Optional replica count forwarded into the server-dry-run/apply job env as WEB_APPLY_REPLICAS -- web-stack.yml's own Justfile var name, verbatim."
        type: string
        required: false
        default: ""
      enable_ci_green_gate:
        description: >-
          CD merge-on-green gate (web-stack.yml's "CI-green gate (SITE
          ci.yml success for this commit) [CD only]" step): runs
          ci_green_gate_recipe via nix-job, gated to repository_dispatch
          only, BEFORE the server-dry-run/apply steps. The manual
          workflow_dispatch path is never gated by this (its authorization
          is the confirm sentinel / protected environment). Defaults true to
          match web-stack.yml's unconditional posture on its CD trigger; a
          caller with a repository_dispatch trigger but no CI-green
          equivalent must explicitly pass false (an audited opt-out). Inert
          by construction for a caller with no repository_dispatch trigger
          at all (this step's own `if:` never matches), so
          mail-cr/list-stack/form-stack/archive-stack need not set it today,
          though the worked example still sets it false for the record.
        type: boolean
        required: false
        default: true
      ci_green_gate_recipe:
        description: "Just recipe implementing the CI-green check, e.g. web-cd-ci-green-gate. Required when enable_ci_green_gate is true; does not follow the <prefix>-<verb> convention because it checks a DIFFERENT repo's CI, not this stack's own."
        type: string
        required: false
        default: ""
      ci_green_repo:
        description: "owner/repo whose ci.yml run must have concluded success for ci_green_sha, forwarded as CI_GREEN_REPO."
        type: string
        required: false
        default: ""
      ci_green_sha:
        description: "Commit SHA to check, forwarded as CI_GREEN_SHA (typically the CD signal's client_payload.sha)."
        type: string
        required: false
        default: ""
      runner_label:
        description: "Runner label for both jobs."
        type: string
        required: false
        default: "tinyland-nix"
    secrets:
      KUBECONFIG_B64:
        description: "Primary kubeconfig secret value, e.g. secrets.MAIL_APPLY_KUBECONFIG_B64 from the caller's protected environment."
        required: false
      KUBECONFIG_B64_ALIAS:
        description: "Compatibility-alias kubeconfig secret value. Leave unset if the stack has no alias."
        required: false
      CI_GREEN_READ_TOKEN:
        description: "Optional read token for the ci_green_repo's run metadata. Falls back to the ambient github.token, matching web-stack.yml's SITE_CI_READ_TOKEN fallback -- only needed when enable_ci_green_gate is true and the target repo is not readable with the default token."
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ inputs.stack_name }}
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Checkout overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: overlay
          persist-credentials: false

      - name: Checkout public GloriousFlywheel core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: ${{ inputs.gf_core_ref }}
          path: GloriousFlywheel
          persist-credentials: false

      - name: Verify GloriousFlywheel core checkout
        shell: bash
        env:
          GF_CORE_REF: ${{ inputs.gf_core_ref }}
        run: |
          set -euo pipefail
          actual="$(git -C GloriousFlywheel rev-parse --verify HEAD)"
          if [ "${actual}" != "${GF_CORE_REF}" ]; then
            echo "::error::GloriousFlywheel checkout mismatch: expected ${GF_CORE_REF}, got ${actual}"
            exit 1
          fi

      - name: Validate manifests (overlay-owned Justfile recipe)
        uses: ./GloriousFlywheel/.github/actions/nix-job
        env:
          GF_JUST_RECIPE_PREFIX: ${{ inputs.just_recipe_prefix }}
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${{ inputs.gf_core_ref }}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just "${GF_JUST_RECIPE_PREFIX}-validate"

  apply:
    name: Server dry-run or apply (${{ inputs.stack_name }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: validate
    runs-on: ${{ inputs.runner_label }}
    environment: ${{ inputs.protected_environment }}
    steps:
      - name: Confirm apply intent (fail-closed sentinel, opt-in)
        # Manual operator path only -- matches web-stack.yml's own gating
        # (`if: github.event_name == 'workflow_dispatch'`) verbatim. The CD
        # (repository_dispatch) path's authorization is the CI-green gate
        # below, never this typed sentinel: a repository_dispatch payload
        # has no operator-typed confirm_value at all, so without this
        # event_name guard every CD deploy would hit the else branch below
        # and hard-fail merge-on-green (confirm_value is always empty on
        # that trigger).
        if: inputs.require_confirm_sentinel && inputs.action == 'apply' && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CONFIRM_VALUE: ${{ inputs.confirm_value }}
        run: |
          if [[ "${CONFIRM_VALUE}" != "apply" ]]; then
            echo "::error::Refusing to apply: set confirm=apply to authorize this cutover (fail-closed, operator-dispatch-only)."
            exit 1
          fi

      # TOOLCHAIN BEFORE FIRST USE. gitops-credential-gate's in-cluster
      # server-URL rewrite (rewrite_in_cluster_server, default true) shells
      # out to bare `kubectl` -- its own PRECONDITION doc names a prior
      # setup-nix step as the way to satisfy that. Every kubectl call in the
      # GFTB source workflows this chassis condenses runs inside
      # `nix develop ... -c kubectl`, never bare, so bare kubectl is not
      # assumed present on this runner class; without this step the
      # credential-gate step below is the FIRST thing in the job that could
      # touch kubectl, before any toolchain exists on PATH.
      - name: Setup Nix (toolchain for the credential gate below)
        if: inputs.rewrite_in_cluster_server
        # Fully-qualified self-reference, pinned exact per RELEASING.md's
        # composite-internal-refs discipline (exact vX.Y.Z, not floating
        # @v2/@main). Unlike gitops-credential-gate below, setup-nix already
        # ships unchanged in the latest real release, so it gets the actual
        # tag rather than a SHA pin.
        uses: tinyland-inc/ci-templates/.github/actions/setup-nix@v2.13.0

      - name: Ensure kubectl on PATH (only used for the in-cluster rewrite)
        if: inputs.rewrite_in_cluster_server
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null 2>&1 || nix profile install nixpkgs#kubectl

      - name: Credential gate + materialize kubeconfig
        id: credentials
        # Fully-qualified self-reference, not ./local: this step runs in the
        # calling repo's checkout, which does not contain this repo's tree.
        # SHA-pinned, not @v2: this repo has cut no vX.Y.Z release
        # containing gitops-credential-gate yet (still under "## [Unreleased]"
        # in CHANGELOG.md as of this commit) -- @v2 (latest: v2.13.0) 404s on
        # this path today, it is not merely a floating-tag policy violation.
        # Per RELEASING.md's composite-internal-refs rule (exact immutable
        # release or a SHA, never @main/@vMAJOR for internal refs) and the
        # third-party-Action convention this repo already follows elsewhere
        # in this file (actions/checkout pinned by commit), pin to this PR's
        # own already-pushed head (tinyland-inc/ci-templates#133 @
        # 1eabc3d) where this composite's unmodified content already lives.
        # Bump to the exact vX.Y.Z tag (proposed v3.0.0 per
        # docs/gitops-stack-chassis.md) once this chassis is released --
        # RELEASING.md step 3 sanctions naming that exact version here
        # before the release commit lands, once it is confirmed rather than
        # still an open question.
        uses: tinyland-inc/ci-templates/.github/actions/gitops-credential-gate@1eabc3d98146a22fb7b383e3131cd162b646938d
        with:
          kubeconfig_b64: ${{ secrets.KUBECONFIG_B64 }}
          kubeconfig_b64_alias: ${{ secrets.KUBECONFIG_B64_ALIAS }}
          secret_name: ${{ inputs.kubeconfig_secret_display_name }}
          secret_name_alias: ${{ inputs.kubeconfig_secret_display_name_alias }}
          environment_name: ${{ inputs.protected_environment }}
          remediation_ref: ${{ inputs.remediation_ref }}
          kubeconfig_filename: "${{ inputs.just_recipe_prefix }}.kubeconfig"
          rewrite_in_cluster_server: ${{ inputs.rewrite_in_cluster_server }}

      - name: Export kubeconfig path under the overlay's own env var name
        # THE LIVE ENV-VAR CONTRACT, verbatim: GFTB's Justfile recipes read
        # a fixed var name per stack family (GFTB_MAIL_KUBECONFIG for
        # mail-cr/list-stack/form-stack/archive-stack,
        # WEB_APPLY_KUBECONFIG for web-stack) -- see
        # `_mail-kubeconfig-inputs` / `_web-apply-kubeconfig-only` in
        # great-falls-tool-bus-infra's Justfile. A chassis-invented name
        # (e.g. the former GITOPS_STACK_KUBECONFIG) is never read by any
        # real recipe, so every server-dry-run/apply/health call would fail
        # closed on a missing-kubeconfig error even with a valid credential.
        # Exported via GITHUB_ENV so it is present, under the caller's exact
        # name, in every later step's shell -- including inside each
        # nix-job step's `nix develop -c just ...` invocation -- without
        # threading it through each step's own `env:` block by a name this
        # workflow cannot know statically.
        shell: bash
        env:
          KUBECONFIG_ENV_VAR_NAME: ${{ inputs.kubeconfig_env_var_name }}
          KUBECONFIG_PATH: ${{ steps.credentials.outputs.kubeconfig_path }}
        run: |
          set -euo pipefail
          echo "${KUBECONFIG_ENV_VAR_NAME}=${KUBECONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Checkout overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: overlay
          persist-credentials: false

      - name: Checkout public GloriousFlywheel core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: ${{ inputs.gf_core_ref }}
          path: GloriousFlywheel
          persist-credentials: false

      - name: Verify GloriousFlywheel core checkout
        shell: bash
        env:
          GF_CORE_REF: ${{ inputs.gf_core_ref }}
        run: |
          set -euo pipefail
          actual="$(git -C GloriousFlywheel rev-parse --verify HEAD)"
          if [ "${actual}" != "${GF_CORE_REF}" ]; then
            echo "::error::GloriousFlywheel checkout mismatch: expected ${GF_CORE_REF}, got ${actual}"
            exit 1
          fi

      - name: CI-green gate (opt-in, repository_dispatch only)
        if: inputs.enable_ci_green_gate && github.event_name == 'repository_dispatch'
        uses: ./GloriousFlywheel/.github/actions/nix-job
        env:
          GH_TOKEN: ${{ secrets.CI_GREEN_READ_TOKEN != '' && secrets.CI_GREEN_READ_TOKEN || github.token }}
          CI_GREEN_SHA: ${{ inputs.ci_green_sha }}
          CI_GREEN_REPO: ${{ inputs.ci_green_repo }}
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            nix develop . -c just "${{ inputs.ci_green_gate_recipe }}"

      - name: Server dry-run
        uses: ./GloriousFlywheel/.github/actions/nix-job
        env:
          # Kubeconfig path is already in the job env under the caller's own
          # name (previous step); not re-declared here under an invented one.
          GF_JUST_RECIPE_PREFIX: ${{ inputs.just_recipe_prefix }}
          # WEB_APPLY_IMAGE / WEB_APPLY_REPLICAS: web-stack.yml's own Justfile
          # var names (web-stack-apply reads these two exact names), not a
          # chassis-generic APPLY_IMAGE/APPLY_REPLICAS no recipe reads.
          WEB_APPLY_IMAGE: ${{ inputs.apply_image }}
          WEB_APPLY_REPLICAS: ${{ inputs.apply_replicas }}
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${{ inputs.gf_core_ref }}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just "${GF_JUST_RECIPE_PREFIX}-server-dry-run"

      # THE THIN SINGLE-VERB GATE. See header comment: this line is the
      # entire apply authority today, and stays a single delegated verb
      # when it later re-points at the owner-overlay controller's
      # Accept/Refuse interface.
      - name: Apply
        if: inputs.action == 'apply'
        uses: ./GloriousFlywheel/.github/actions/nix-job
        env:
          # Kubeconfig path is already in the job env under the caller's own
          # name (Export step above); not re-declared here under an invented
          # one. WEB_APPLY_IMAGE/WEB_APPLY_REPLICAS: see Server dry-run above.
          GF_JUST_RECIPE_PREFIX: ${{ inputs.just_recipe_prefix }}
          WEB_APPLY_IMAGE: ${{ inputs.apply_image }}
          WEB_APPLY_REPLICAS: ${{ inputs.apply_replicas }}
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${{ inputs.gf_core_ref }}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just "${GF_JUST_RECIPE_PREFIX}-apply"

      - name: In-cluster health gate (opt-in)
        if: inputs.action == 'apply' && inputs.has_health_gate
        uses: ./GloriousFlywheel/.github/actions/nix-job
        env:
          # Kubeconfig path is already in the job env under the caller's own
          # name (Export step above).
          GF_JUST_RECIPE_PREFIX: ${{ inputs.just_recipe_prefix }}
        with:
          push-cache: "false"
          command: |
            set -euo pipefail
            cd overlay
            export GF_CORE_PATH=../GloriousFlywheel
            export GF_CORE_CI_PATH="github:tinyland-inc/GloriousFlywheel/${{ inputs.gf_core_ref }}#ci"
            nix develop "${GF_CORE_CI_PATH}" -c just "${GF_JUST_RECIPE_PREFIX}-health" | tee "${RUNNER_TEMP}/gitops-stack-health.txt"
            {
              echo "## ${{ inputs.stack_name }} apply"
              echo ""
              echo "On-cluster health gate:"
              echo ""
              echo '```'
              cat "${RUNNER_TEMP}/gitops-stack-health.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
