# DEPRECATED (TIN-489, post-#1255): inherits spoke-lane-env.yml's
# Blahaj-repository_dispatch PR-env lifecycle, which Blahaj (cluster
# substrate only, post-#1255) no longer owns. The producer is the
# application's owner-overlay repository (see tinyland-inc/site.scaffold
# docs/patterns/owner-overlay-apply-plane.md). Kept callable, unchanged,
# only so existing private-repo callers don't break — do not point a new
# spoke at this.
name: spoke-lane-env-restricted
on:
  workflow_call:
    inputs:
      runner_group:
        type: string
        required: true
        description: Reviewed owner-overlay GitHub runner group; this release requires tinyland-infra.
      nix_runner_label:
        type: string
        required: true
        description: Reviewed base capability; the restricted contract requires tinyland-nix.
      dind_runner_label:
        type: string
        required: true
        description: Reviewed image-build capability; the restricted contract requires tinyland-dind.
      kvm_runner_label:
        type: string
        required: true
        description: Reviewed KVM capability; the restricted contract requires tinyland-nix-kvm.
      spoke:
        type: string
        required: true
      image_repository:
        type: string
        required: false
        description: Defaults to ghcr.io/<repo-owner>/<spoke>.
        default: ""
      lanes_path:
        type: string
        default: .github/lanes.json
      blahaj_repository:
        type: string
        default: tinyland-inc/blahaj
      enable_tailnet_qa:
        type: boolean
        default: false
      reap:
        type: boolean
        default: false
      pr_number:
        type: number
        required: false
        default: 0
    secrets:
      BLAHAJ_DISPATCH_TOKEN:
        # required: false so spokes can keep `on: pull_request` enabled
        # before Blahaj is installed on the repo. Internal early-exit
        # below (`check-blahaj-token` job) gates the dispatch on token
        # presence — empty token = whole pipeline skips cleanly. See
        # https://github.com/Jesssullivan/darkmap.tinyland.dev/pull/82
        # for the finding that drove this change.
        required: false
      TAILSCALE_API_KEY:
        required: false

permissions:
  contents: read
  packages: write
  pull-requests: write
  statuses: write
  deployments: write

concurrency:
  group: spoke-lane-env-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  # Public/fork events and inadmissible group/capability inputs are rejected by
  # job-level policy before GitHub assigns a runner. No caller content is checked out.
  trust-gate:
    if: >-
      ${{
        github.event.repository.private == true &&
        ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') ||
        github.event.pull_request.head.repo.full_name == github.repository) &&
        inputs.runner_group == 'tinyland-infra' &&
        inputs.nix_runner_label == 'tinyland-nix' &&
        inputs.dind_runner_label == 'tinyland-dind' &&
        inputs.kvm_runner_label == 'tinyland-nix-kvm'
      }}
    runs-on:
      group: ${{ inputs.runner_group }}
      labels: ${{ inputs.nix_runner_label }}
    timeout-minutes: 2
    steps:
      - name: Validate private runner route
        shell: bash
        env:
          RUNNER_GROUP: ${{ inputs.runner_group }}
          NIX_RUNNER_LABEL: ${{ inputs.nix_runner_label }}
          DIND_RUNNER_LABEL: ${{ inputs.dind_runner_label }}
          KVM_RUNNER_LABEL: ${{ inputs.kvm_runner_label }}
        run: |
          set -euo pipefail
          group="$(printf '%s' "$RUNNER_GROUP" | tr '[:upper:]' '[:lower:]')"
          case "$group" in
            default|shared|github-actions|github-hosted|self-hosted)
              echo "::error::restricted workflows reject generic/shared runner group '$RUNNER_GROUP'"
              exit 1
              ;;
          esac
          [[ "$group" == "tinyland-infra" ]] || {
            echo "::error::runner_group must be the reviewed tinyland-infra owner-overlay group"; exit 1;
          }
          [[ "$NIX_RUNNER_LABEL" == "tinyland-nix" ]] || {
            echo "::error::nix_runner_label must be the reviewed tinyland-nix capability"; exit 1;
          }
          [[ "$DIND_RUNNER_LABEL" == "tinyland-dind" ]] || {
            echo "::error::dind_runner_label must be the reviewed tinyland-dind capability"; exit 1;
          }
          [[ "$KVM_RUNNER_LABEL" == "tinyland-nix-kvm" ]] || {
            echo "::error::kvm_runner_label must be the reviewed tinyland-nix-kvm capability"; exit 1;
          }

  # Early-exit gate. If BLAHAJ_DISPATCH_TOKEN is empty (Blahaj not yet
  # installed on the calling spoke), `enabled=false` is emitted and
  # every downstream job's `if:` short-circuits. The workflow shows
  # green with all jobs skipped, NOT a parse-time failure.
  check-blahaj-token:
    needs: [trust-gate]
    runs-on:
      group: ${{ inputs.runner_group }}
      labels: ${{ inputs.nix_runner_label }}
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - id: probe
        env:
          TOKEN: ${{ secrets.BLAHAJ_DISPATCH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BLAHAJ_DISPATCH_TOKEN present; lane-env pipeline will run."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BLAHAJ_DISPATCH_TOKEN empty; lane-env pipeline skipping cleanly (no Blahaj integration yet)."
          fi

  lanes-load:
    needs: [trust-gate, check-blahaj-token]
    if: needs.check-blahaj-token.outputs.enabled == 'true'
    runs-on:
      group: ${{ inputs.runner_group }}
      labels: ${{ inputs.nix_runner_label }}
    outputs:
      lanes_json: ${{ steps.load.outputs.lanes_json }}
      spoke_name: ${{ steps.load.outputs.spoke_name }}
      spoke_domain: ${{ steps.load.outputs.spoke_domain }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: tinyland-inc/ci-templates/.github/actions/setup-nix@v2.12.1
      - id: load
        uses: tinyland-inc/ci-templates/.github/actions/lanes-load@v2.12.1
        with:
          path: ${{ inputs.lanes_path }}

  publish-image:
    if: needs.check-blahaj-token.outputs.enabled == 'true' && github.event.action != 'closed' && !inputs.reap
    needs: [trust-gate, check-blahaj-token, lanes-load]
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJson(needs.lanes-load.outputs.lanes_json) }}
    runs-on:
      group: ${{ inputs.runner_group }}
      labels: ${{ inputs.dind_runner_label }}
    outputs:
      image_ref: ${{ steps.build.outputs.image_ref }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve image ref
        id: imgref
        run: |
          set -euo pipefail
          repo="${{ inputs.image_repository }}"
          if [[ -z "$repo" ]]; then
            owner=$(echo "${{ github.repository }}" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
            repo="ghcr.io/$owner/${{ inputs.spoke }}"
          fi
          tag="pr-${{ github.event.pull_request.number }}-sha-${{ github.event.pull_request.head.sha }}"
          echo "image_ref=${repo}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - id: build
        name: Build + push image
        run: |
          set -euo pipefail
          docker build -t "${{ steps.imgref.outputs.image_ref }}" .
          docker push "${{ steps.imgref.outputs.image_ref }}"
          echo "image_ref=${{ steps.imgref.outputs.image_ref }}" >> "$GITHUB_OUTPUT"

  dispatch-apply:
    if: needs.check-blahaj-token.outputs.enabled == 'true' && github.event.action != 'closed' && !inputs.reap
    needs: [trust-gate, check-blahaj-token, lanes-load, publish-image]
    runs-on:
      group: ${{ inputs.runner_group }}
      labels: ${{ inputs.nix_runner_label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: tinyland-inc/ci-templates/.github/actions/setup-nix@v2.12.1
      - uses: tinyland-inc/ci-templates/.github/actions/lane-dispatch@v2.12.1
        with:
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
          commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          spoke: ${{ needs.lanes-load.outputs.spoke_name }}
          domain: ${{ needs.lanes-load.outputs.spoke_domain }}
          image_ref: ${{ needs.publish-image.outputs.image_ref }}
          lanes_json: ${{ needs.lanes-load.outputs.lanes_json }}
          pr_labels_json: ${{ toJson(github.event.pull_request.labels.*.name) }}
          blahaj_repository: ${{ inputs.blahaj_repository }}
          dispatch_token: ${{ secrets.BLAHAJ_DISPATCH_TOKEN }}

  tailnet-qa:
    if: needs.check-blahaj-token.outputs.enabled == 'true' && github.event.action != 'closed' && !inputs.reap && inputs.enable_tailnet_qa
    needs: [trust-gate, check-blahaj-token, lanes-load, dispatch-apply]
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJson(needs.lanes-load.outputs.lanes_json) }}
    runs-on:
      group: ${{ inputs.runner_group }}
      labels: ${{ inputs.kvm_runner_label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - if: matrix.lane.e2e
        name: E2E against lane env
        run: |
          set -euo pipefail
          echo "running E2E against pr-${{ github.event.pull_request.number }}-${{ matrix.lane.name }}.${{ needs.lanes-load.outputs.spoke_domain }}"
          # Spokes plug their own E2E command here via a follow-up workflow.
          # This job exists to gate the per-lane `ci/lane/<name>` E2E status.

  destroy-lanes:
    if: needs.check-blahaj-token.outputs.enabled == 'true' && (github.event.action == 'closed' || inputs.reap)
    needs: [trust-gate, check-blahaj-token, lanes-load]
    runs-on:
      group: ${{ inputs.runner_group }}
      labels: ${{ inputs.nix_runner_label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: tinyland-inc/ci-templates/.github/actions/setup-nix@v2.12.1
      - uses: tinyland-inc/ci-templates/.github/actions/lane-reap@v2.12.1
        with:
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
          spoke: ${{ needs.lanes-load.outputs.spoke_name }}
          domain: ${{ needs.lanes-load.outputs.spoke_domain }}
          commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          lanes_json: ${{ needs.lanes-load.outputs.lanes_json }}
          blahaj_repository: ${{ inputs.blahaj_repository }}
          dispatch_token: ${{ secrets.BLAHAJ_DISPATCH_TOKEN }}
