# Superseded (2026-08-05): the blahaj receiver path was evicted (blahaj #1255);
# lane lifecycle belongs to the app owner overlay — see site.scaffold
# docs/patterns/production-convergence.md and the pending scaffold #119 recut.
# Released behavior is unchanged (spokes pin immutable tags), but
# tinyland-inc/blahaj no longer hosts the receiver; do not wire new spokes at
# blahaj. The behavior recut ships via the versioned release train.
name: spoke-lane-ttl-reap

on:
  workflow_call:
    inputs:
      spoke:
        type: string
        required: true
      domain:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
      blahaj_repository:
        type: string
        default: tinyland-inc/blahaj
      dry_run_only:
        type: boolean
        default: false
    secrets:
      BLAHAJ_DISPATCH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch expired lane reap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: tinyland-inc/ci-templates/.github/actions/lane-ttl-reap@v2
        with:
          spoke: ${{ inputs.spoke }}
          domain: ${{ inputs.domain }}
          dry_run: ${{ inputs.dry_run }}
          blahaj_repository: ${{ inputs.blahaj_repository }}
          dry_run_only: ${{ inputs.dry_run_only }}
          dispatch_token: ${{ secrets.BLAHAJ_DISPATCH_TOKEN }}
