name: validate

# CT-01 (TIN-3396): ci-templates' first PR validation lane. This repo ships
# ~190 repos' shared CI surface but, until this workflow, never validated its
# own changes on a pull request — the full `just check` chain (15 targets;
# see Justfile) only ran when a human remembered to run it locally. This
# wires the existing chain up; it does not add new validation logic.
#
# Runner-class decision (issue #107 acceptance criterion 4): `tinyland-nix`,
# not a hosted `ubuntu-*` runner. scripts/runner_label_taxonomy.rb and
# scripts/lint-runs-on.rb (the authoritative `runs-on` grammar for this repo)
# treat `tinyland-nix` as the canonical shared ARC capability-class label, and
# commit 12ba7835 ("retire implicit hosted execution") is explicit precedent
# against reintroducing hosted execution here. site.scaffold's own thin CI
# wrapper (`ci.yml`) also resolves to `default_runner_class: tinyland-nix`.
# An implicitly-hosted validate lane would repeat exactly the mistake that
# commit retired.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    # ubuntu-latest, deliberately: this repo has ZERO registered self-hosted
    # runners (actions/runners total_count 0), and the prior tinyland-nix
    # attempt queued 24h to GitHub's ceiling and was auto-cancelled with zero
    # steps executed (run 31117501631). AGENTS.md's never-ubuntu-latest rule
    # is scoped to the cache-backed js-bazel-package substrate lane, not
    # repo-local validation; twelve direct jobs here already use it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # setup-nix (detect-or-install), NOT nix-setup: the hosted image ships
      # no Nix, and nix-setup only configures an already-present install.
      - name: Nix Setup
        uses: ./.github/actions/setup-nix

      - name: just check (full 15-target validation chain)
        run: nix develop --no-eval-cache --command just check

      # actionlint over this repo's own workflows + composite actions
      # (dogfood — a lint regression in ci-templates' own surface must break
      # ci-templates' own CI first). `.github/actionlint.yaml` declares this
      # repo's org-namespaced ARC capability-class `runs-on` labels as known
      # self-hosted-runner labels (config, not suppression — it mirrors
      # RunnerLabelTaxonomy::SHARED_CAPABILITY_LABELS). Two `-ignore` patterns
      # below suppress, each by exact diagnostic text (not a rule-id blanket
      # ignore), the repo's two known pre-existing false positives /
      # out-of-scope findings:
      #   1. actionlint 1.7.x's built-in `runner` context type does not yet
      #      include the `labels` property GitHub Actions added to it, so
      #      `${{ join(runner.labels, ',') }}` (used in nix-setup / spoke-ci /
      #      js-bazel-package to detect the ARC capability-class label) is
      #      flagged as an undefined property. Mirrors PR #95's approach.
      #   2. `spoke-ci.yml:252`'s unquoted `${BAZEL_TARGETS}` (SC2086, info)
      #      is a real, pre-existing shellcheck finding on `main` — it is NOT
      #      introduced by this PR and is explicitly out of scope for CT-01
      #      (fixing it means re-cutting `scripts/restricted-workflow-
      #      contract.rb`'s `spoke-ci` legacy byte pin, a
      #      restricted-workflow-governance change this PR does not make).
      #      Tracked for follow-up under the pin-drift/governance workstream,
      #      not silently fixed here.
      - name: actionlint
        run: |
          nix develop --no-eval-cache --command \
            actionlint -color \
              -config-file .github/actionlint.yaml \
              -ignore 'property "labels" is not defined' \
              -ignore 'SC2086:info:8:38: Double quote to prevent globbing and word splitting'
